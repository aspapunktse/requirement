name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Vercel's own Git auto-deploy is disabled for main in vercel.json, so
  # production only ever deploys from here, after CI has passed.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_rYyzeCcAGDrF5PVgonmbhDOO
      VERCEL_PROJECT_ID: prj_whCroO48Sq1pZZa0yLpdDUI8she3
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # The checkout above is a detached HEAD at the exact commit CI passed, so
      # `vercel deploy` would record the branch as "HEAD". Name it `main` (still
      # that same commit) so Vercel shows the production branch correctly.
      - name: Name the checkout main
        run: git checkout -B main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require VERCEL_TOKEN
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set (add it to the 'production' environment or repo secrets)"
            exit 1
          fi

      # No local `vercel build`: the project's build command runs `prisma migrate deploy`,
      # which needs DATABASE_URL, and `vercel pull` doesn't return Sensitive env vars.
      # Letting Vercel build remotely keeps those values out of GitHub.
      - name: Deploy to production
        run: npx --yes vercel@59.23.2 deploy --prod --yes --token="$VERCEL_TOKEN"
