<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Systems Register Table</title>
<link rel="stylesheet" href="systems.css">
<style>
/* Proposal A: a filterable, sortable register table. Saved views and status tabs on top,
   filter chips under them, then a dense table with sticky header, grouping and paging. */
.page { max-width: 1320px; margin: 0 auto; padding: 24px 20px 64px; display: grid; gap: 16px; }
.page > * { min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.head p { color: var(--muted); margin-top: 4px; }

.views { display: flex; gap: 6px; flex-wrap: wrap; }
.view { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: .84rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.view b { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.view[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.view[aria-pressed="true"] b { color: inherit; opacity: .7; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: clip; }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 12px 10px 10px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; }
.tab .n { font-size: .74rem; font-variant-numeric: tabular-nums; background: var(--raised); border: 1px solid var(--line-soft); padding: 0 6px; border-radius: 99px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab[aria-selected="true"] .n { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; border-bottom: 1px solid var(--line-soft); }
.toolbar .search { flex: 1 1 260px; max-width: 360px; }
.filter { position: relative; }
.filter > button { border: 1px dashed var(--line); background: transparent; border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: .84rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.filter > button.on { border-style: solid; border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 650; }
.menu { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: none; }
.filter.open .menu { display: block; }
.menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: .86rem; }
.menu label:hover { background: var(--raised); }
.menu label span:last-child { margin-left: auto; color: var(--faint); font-size: .76rem; font-variant-numeric: tabular-nums; }
.menu input { accent-color: var(--accent); }
.spacer { flex: 1; }
.clear { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: .84rem; font-weight: 600; }

.tablewrap { overflow-x: auto; max-height: calc(100vh - 150px); }
table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 960px; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--raised); text-align: left; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
thead th button:focus-visible { outline: 2px solid var(--accent); }
thead th .arr { opacity: .35; font-size: .7rem; }
thead th[aria-sort] .arr { opacity: 1; color: var(--accent); }
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
body.compact tbody td { padding-block: 5px; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--raised); }
tbody tr.sel td { background: var(--accent-soft); }
td.chk, th.chk { width: 36px; padding-right: 0; }
td.chk input, th.chk input { accent-color: var(--accent); }
.name { display: flex; flex-direction: column; min-width: 0; }
.name a { color: var(--ink); font-weight: 650; text-decoration: none; }
.name a:hover { color: var(--accent); text-decoration: underline; }
.name small { color: var(--faint); font-size: .78rem; }
body.compact .name small { display: none; }
.owner { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.facets { display: flex; gap: 4px; }
.grp td { background: var(--paper) !important; font-size: .78rem; font-weight: 700; color: var(--muted); padding: 7px 12px; cursor: default; position: sticky; top: 36px; z-index: 1; }
.grp td .n { font-weight: 500; color: var(--faint); margin-left: 6px; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }

.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border-top: 1px solid var(--line); font-size: .84rem; color: var(--muted); }
.pager { display: flex; gap: 4px; align-items: center; }
.pager button { min-width: 30px; height: 30px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; }
.pager button[aria-current] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.pager button:disabled { opacity: .4; cursor: default; }

.bulk { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 140%); transition: transform .25s ease; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 8px 8px 8px 16px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow); z-index: 30; max-width: calc(100vw - 32px); }
.bulk.show { transform: translate(-50%, 0); }
.bulk button { background: transparent; color: inherit; border: 1px solid color-mix(in srgb, var(--paper) 30%, transparent); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .bulk { transition: none; } }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--muted); align-items: center; }
.legend .cia { height: 12px; }

/* Phones: the table turns into stacked rows */
@media (max-width: 720px) {
  .page { padding-inline: 16px; }
  .tablewrap { max-height: none; }
  table, tbody { display: block; min-width: 0; }
  thead { display: none; }
  tbody tr:not(.grp) { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; padding: 12px; border-bottom: 1px solid var(--line-soft); }
  tbody tr:not(.grp) td { display: block; padding: 0; border: 0; background: none !important; }
  tbody td.chk { grid-row: 1 / span 3; }
  tbody td.c-name { grid-column: 2; }
  tbody td.c-status { grid-column: 3; grid-row: 1; }
  tbody td.c-owner, tbody td.c-prog { grid-column: 2 / span 2; }
  tbody td.c-facets, tbody td.c-cia, tbody td.c-unit, tbody td.c-upd { display: none !important; }
  .grp { display: block; } .grp td { display: block; top: 0; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">IS</div>
  <div><b>ISMS</b><small>System onboarding</small></div>
  <nav aria-label="Main"><a href="#">Home</a><a href="#" aria-current="page">Systems</a><a href="#">Controls</a><a href="#">Risks</a><a href="#">Check-ups</a><a href="#">Frameworks</a></nav>
  <div class="proposal-switch">Proposal A · <a href="proposal-b.html">see B</a></div>
</header>

<main class="page">
  <div class="head">
    <div>
      <div class="eyebrow">Proposal A · Register table</div>
      <h1>Systems</h1>
      <p><span id="total" class="num"></span> systems you can see. Filter, sort and group to find one.</p>
    </div>
    <a class="btn primary" href="#">+ New System</a>
  </div>

  <div class="views" role="group" aria-label="Saved views" id="views"></div>

  <section class="card">
    <div class="tabs" role="tablist" aria-label="Status" id="tabs"></div>
    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
        <input id="q" type="search" placeholder="Search name, vendor or owner" aria-label="Search systems">
        <kbd>/</kbd>
      </label>
      <div id="filters" style="display:contents"></div>
      <button class="clear" id="clear" hidden>Clear filters</button>
      <span class="spacer"></span>
      <label class="muted" style="font-size:.84rem">Group by
        <select class="sel" id="group"><option value="">None</option><option value="owner">Owner</option><option value="unit">Business Unit</option><option value="facet">Deployment</option></select>
      </label>
      <button class="btn ghost" id="density" aria-pressed="false" title="Toggle compact rows">Compact</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="foot">
      <div class="legend">
        <span>CIA impact:</span>
        <span><span class="cia"><i data-l="0"></i></span> not classified</span>
        <span><span class="cia"><i data-l="1"></i></span> low</span>
        <span><span class="cia"><i data-l="2"></i></span> moderate</span>
        <span><span class="cia"><i data-l="3"></i></span> high</span>
        <span><span class="cia"><i data-l="4"></i></span> critical</span>
      </div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <span id="range" class="num"></span>
        <label>Rows <select class="sel" id="per"><option>25</option><option selected>50</option><option>100</option></select></label>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </section>
</main>

<div class="bulk" id="bulk" role="region" aria-label="Bulk actions">
  <span><b id="selN">0</b> selected</span>
  <button>Change owner</button><button>Add to Check-up</button><button>Export CSV</button>
  <button id="unsel" aria-label="Clear selection">✕</button>
</div>

<script src="data.js"></script>
<script>
(function () {
  const { systems, STATUSES, FACETS, UNITS, OWNERS, LEVELS, fmtAgo, initials, esc, statusOf } = window.SYS;
  const ME = 'Priya Shah';
  const st = { view: 'all', status: '', q: '', sort: 'name', dir: 1, group: '', page: 1, per: 50, f: { owner: new Set(), unit: new Set(), facet: new Set(), impact: new Set() }, sel: new Set() };

  const VIEWS = [
    { key: 'all', label: 'All systems', test: () => true },
    { key: 'mine', label: 'Owned by me', test: (s) => s.owner === ME },
    { key: 'attention', label: 'Needs attention', test: (s) => s.questions > 0 || s.status === 'REJECTED' || (s.status === 'DRAFT' && (SYS.now - s.updated) > 60 * 864e5) },
    { key: 'unclassified', label: 'Not classified', test: (s) => !s.c || !s.i || !s.a },
    { key: 'providers', label: 'Providers', test: (s) => s.provider }
  ];
  const lvl = (v) => LEVELS.indexOf(v) < 0 ? 0 : LEVELS.indexOf(v);
  const maxLvl = (s) => Math.max(lvl(s.c), lvl(s.i), lvl(s.a));
  const FILTERS = [
    { key: 'owner', label: 'Owner', opts: OWNERS.slice().sort(), get: (s) => [s.owner] },
    { key: 'unit', label: 'Business Unit', opts: UNITS, get: (s) => s.units },
    { key: 'facet', label: 'Deployment', opts: FACETS.map((f) => f.label), get: (s) => s.facets.map((k) => SYS.facetOf(k).label) },
    { key: 'impact', label: 'Highest impact', opts: ['Not classified', 'Low', 'Moderate', 'High', 'Critical'], get: (s) => [['Not classified', 'Low', 'Moderate', 'High', 'Critical'][maxLvl(s)]] }
  ];
  const COLS = [
    { key: 'chk', cls: 'chk' },
    { key: 'name', label: 'System', sort: (s) => s.name.toLowerCase() },
    { key: 'status', label: 'Status', sort: (s) => STATUSES.findIndex((x) => x.key === s.status) },
    { key: 'owner', label: 'Owner', sort: (s) => s.owner },
    { key: 'facets', label: 'Deployment' },
    { key: 'cia', label: 'C · I · A', sort: (s) => -maxLvl(s) },
    { key: 'unit', label: 'Business Unit', sort: (s) => s.units[0] },
    { key: 'prog', label: 'Controls fulfilled', sort: (s) => s.fulfilled / s.controls },
    { key: 'upd', label: 'Updated', sort: (s) => -s.updated }
  ];

  const $ = (id) => document.getElementById(id);
  const baseSet = () => systems.filter(VIEWS.find((v) => v.key === st.view).test).filter((s) => {
    if (st.q) { const q = st.q.toLowerCase(); if (!(s.name + ' ' + (s.vendor || '') + ' ' + s.owner).toLowerCase().includes(q)) return false; }
    return FILTERS.every((f) => !st.f[f.key].size || f.get(s).some((v) => st.f[f.key].has(v)));
  });

  function renderViews() {
    $('views').innerHTML = VIEWS.map((v) => `<button class="view" aria-pressed="${st.view === v.key}" data-v="${v.key}">${v.label} <b>${systems.filter(v.test).length}</b></button>`).join('');
  }
  function renderTabs(base) {
    const tabs = [{ key: '', label: 'All' }].concat(STATUSES);
    $('tabs').innerHTML = tabs.map((t) => `<button class="tab" role="tab" aria-selected="${st.status === t.key}" data-s="${t.key}">${t.key ? `<span class="dot ${t.tone}"></span>` : ''}${t.label}<span class="n">${base.filter((s) => !t.key || s.status === t.key).length}</span></button>`).join('');
  }
  function renderFilters(base) {
    $('filters').innerHTML = FILTERS.map((f) => {
      const sel = st.f[f.key];
      const label = sel.size === 0 ? `+ ${f.label}` : sel.size === 1 ? `${f.label}: ${esc([...sel][0])}` : `${f.label}: ${sel.size}`;
      const items = f.opts.map((o) => `<label><input type="checkbox" data-f="${f.key}" value="${esc(o)}" ${sel.has(o) ? 'checked' : ''}><span>${esc(o)}</span><span>${base.filter((s) => f.get(s).includes(o)).length}</span></label>`).join('');
      return `<div class="filter" data-filter="${f.key}"><button class="${sel.size ? 'on' : ''}" aria-haspopup="true">${label} ▾</button><div class="menu">${items}</div></div>`;
    }).join('');
    $('clear').hidden = !FILTERS.some((f) => st.f[f.key].size) && !st.q;
  }
  function renderHead() {
    $('thead').innerHTML = COLS.map((c) => {
      if (c.key === 'chk') return `<th class="chk"><input type="checkbox" id="all" aria-label="Select all on page"></th>`;
      if (!c.sort) return `<th>${c.label}</th>`;
      const on = st.sort === c.key;
      return `<th ${on ? `aria-sort="${st.dir > 0 ? 'ascending' : 'descending'}"` : ''}><button data-sort="${c.key}">${c.label}<span class="arr">${on && st.dir < 0 ? '▼' : '▲'}</span></button></th>`;
    }).join('');
  }
  function row(s) {
    const so = statusOf(s.status);
    const pct = Math.round(100 * s.fulfilled / s.controls);
    return `<tr class="${st.sel.has(s.id) ? 'sel' : ''}" data-id="${s.id}">
      <td class="chk"><input type="checkbox" ${st.sel.has(s.id) ? 'checked' : ''} aria-label="Select ${esc(s.name)}"></td>
      <td class="c-name"><div class="name"><a href="#" onclick="return false">${esc(s.name)}</a><small>${s.vendor ? esc(s.vendor) : 'Built in-house'}${s.provider ? ' · <span class="prov">Provider</span>' : ''}</small></div></td>
      <td class="c-status"><span class="chip ${so.tone}">${so.label}</span>${s.questions ? ` <span class="qbadge" title="Open questions">? ${s.questions}</span>` : ''}</td>
      <td class="c-owner"><span class="owner"><span class="av">${initials(s.owner)}</span>${esc(s.owner)}</span></td>
      <td class="c-facets"><span class="facets">${s.facets.map((k) => `<span class="facet" title="${SYS.facetOf(k).label}">${{ S: 'SaaS', C: 'Cloud', O: 'On-prem' }[k]}</span>`).join('')}</span></td>
      <td class="c-cia"><span class="cia" title="C ${s.c || '—'} · I ${s.i || '—'} · A ${s.a || '—'}"><i data-l="${lvl(s.c)}"></i><i data-l="${lvl(s.i)}"></i><i data-l="${lvl(s.a)}"></i></span></td>
      <td class="c-unit muted">${esc(s.units[0])}${s.units.length > 1 ? ` <span style="color:var(--faint)">+${s.units.length - 1}</span>` : ''}</td>
      <td class="c-prog"><div class="prog"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span>${s.fulfilled}/${s.controls}</span></div></td>
      <td class="c-upd muted num">${fmtAgo(s.updated)}</td></tr>`;
  }
  function groupKey(s) {
    if (st.group === 'owner') return [s.owner];
    if (st.group === 'unit') return s.units;
    if (st.group === 'facet') return [s.facets.map((k) => SYS.facetOf(k).label).join(' + ')];
    return [''];
  }
  function render() {
    const base = baseSet();
    renderViews(); renderTabs(base); renderFilters(base); renderHead();
    let list = base.filter((s) => !st.status || s.status === st.status);
    const col = COLS.find((c) => c.key === st.sort);
    list.sort((a, b) => { const x = col.sort(a), y = col.sort(b); return (x < y ? -1 : x > y ? 1 : 0) * st.dir; });
    $('total').textContent = systems.length;
    const pages = Math.max(1, Math.ceil(list.length / st.per));
    st.page = Math.min(st.page, pages);
    const from = (st.page - 1) * st.per;
    const pageItems = list.slice(from, from + st.per);
    let html = '';
    if (!pageItems.length) html = `<tr><td colspan="9" class="empty">No systems match. <button class="clear" data-reset>Clear filters</button></td></tr>`;
    else if (!st.group) html = pageItems.map(row).join('');
    else {
      const groups = new Map();
      pageItems.forEach((s) => groupKey(s).forEach((k) => { if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); }));
      [...groups.keys()].sort().forEach((k) => { html += `<tr class="grp"><td colspan="9">${esc(k)}<span class="n">${groups.get(k).length}</span></td></tr>` + groups.get(k).map(row).join(''); });
    }
    $('rows').innerHTML = html;
    $('range').textContent = list.length ? `${from + 1}–${Math.min(from + st.per, list.length)} of ${list.length}` : '0 of 0';
    let pg = `<button data-p="${st.page - 1}" ${st.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>`;
    for (let p = 1; p <= pages; p++) pg += `<button data-p="${p}" ${p === st.page ? 'aria-current="page"' : ''}>${p}</button>`;
    pg += `<button data-p="${st.page + 1}" ${st.page === pages ? 'disabled' : ''} aria-label="Next page">›</button>`;
    $('pager').innerHTML = pg;
    const all = $('all'); const ids = pageItems.map((s) => s.id);
    all.checked = ids.length && ids.every((id) => st.sel.has(id));
    all.indeterminate = !all.checked && ids.some((id) => st.sel.has(id));
    all.onchange = () => { ids.forEach((id) => all.checked ? st.sel.add(id) : st.sel.delete(id)); render(); };
    $('selN').textContent = st.sel.size; $('bulk').classList.toggle('show', st.sel.size > 0);
  }

  document.addEventListener('click', (e) => {
    const t = e.target;
    const v = t.closest('[data-v]'); if (v) { st.view = v.dataset.v; st.page = 1; return render(); }
    const s = t.closest('[data-s]'); if (s) { st.status = s.dataset.s; st.page = 1; return render(); }
    const so = t.closest('[data-sort]'); if (so) { st.dir = st.sort === so.dataset.sort ? -st.dir : 1; st.sort = so.dataset.sort; return render(); }
    const p = t.closest('[data-p]'); if (p && !p.disabled) { st.page = +p.dataset.p; return render(); }
    if (t.closest('[data-reset]') || t.id === 'clear') { Object.values(st.f).forEach((x) => x.clear()); st.q = ''; $('q').value = ''; st.view = 'all'; st.status = ''; return render(); }
    const fb = t.closest('.filter > button');
    document.querySelectorAll('.filter.open').forEach((f) => { if (!f.contains(t)) f.classList.remove('open'); });
    if (fb) { fb.parentElement.classList.toggle('open'); return; }
    if (t.closest('.menu')) return;
    const tr = t.closest('tbody tr[data-id]');
    if (tr) { const id = tr.dataset.id; if (t.matches('input[type=checkbox]')) { st.sel.has(id) ? st.sel.delete(id) : st.sel.add(id); render(); } }
  });
  document.addEventListener('change', (e) => {
    const f = e.target.dataset.f; if (!f) return;
    e.target.checked ? st.f[f].add(e.target.value) : st.f[f].delete(e.target.value);
    st.page = 1; render();
    document.querySelector(`[data-filter="${f}"]`).classList.add('open');
  });
  $('q').addEventListener('input', (e) => { st.q = e.target.value; st.page = 1; render(); });
  $('group').addEventListener('change', (e) => { st.group = e.target.value; render(); });
  $('per').addEventListener('change', (e) => { st.per = +e.target.value; st.page = 1; render(); });
  $('density').addEventListener('click', (e) => { const on = document.body.classList.toggle('compact'); e.currentTarget.setAttribute('aria-pressed', on); });
  $('unsel').addEventListener('click', () => { st.sel.clear(); render(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape') document.querySelectorAll('.filter.open').forEach((f) => f.classList.remove('open'));
  });
  render();
})();
</script>
</body>
</html>
