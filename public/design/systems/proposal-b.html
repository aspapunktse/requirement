<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Systems Portfolio View</title>
<link rel="stylesheet" href="systems.css">
<style>
/* Proposal B: an overview first (onboarding pipeline + what needs attention), then a grouped
   list with a preview pane, so you can scan 100+ systems without leaving the page. */
[hidden] { display: none !important; }
.scrim { display: none; }
.page { max-width: 1320px; margin: 0 auto; padding: 24px 20px 48px; display: grid; gap: 18px; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.head p { color: var(--muted); margin-top: 4px; }

.overview { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 980px) { .overview { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.pipe { padding: 18px 20px; display: grid; gap: 14px; }
.pipe-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pipe-top b { font-size: 2rem; font-weight: 750; line-height: 1; font-variant-numeric: tabular-nums; }
.pipe-top span { color: var(--muted); font-size: .86rem; }
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.stage { border: 1px solid var(--line-soft); background: var(--raised); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; display: grid; gap: 6px; transition: border-color .15s, background .15s; }
.stage:hover { border-color: var(--accent); }
.stage[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.stage .lbl { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.stage .n { font-size: 1.4rem; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1; }
.stage .bar { height: 4px; border-radius: 99px; background: var(--line-soft); overflow: hidden; }
.stage .bar i { display: block; height: 100%; border-radius: 99px; }
@media (max-width: 620px) { .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.attn { padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.attn h2 { font-size: .74rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.alert { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line-soft); border-radius: 10px; padding: 9px 12px; cursor: pointer; background: var(--surface); text-align: left; width: 100%; }
.alert:hover { border-color: var(--accent); }
.alert[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.alert .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; flex: none; }
.alert .ic.w { background: var(--gold-soft); color: var(--gold-ink); }
.alert .ic.d { background: var(--bad-soft); color: var(--bad); }
.alert .ic.n { background: var(--raised); color: var(--muted); border: 1px solid var(--line-soft); }
.alert b { font-variant-numeric: tabular-nums; }
.alert .go { margin-left: auto; color: var(--faint); }

.split { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; align-items: start; }
@media (max-width: 980px) { .split { grid-template-columns: minmax(0, 1fr); } }
.listpanel { overflow: clip; }
.lbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); }
.lbar .search { flex: 1 1 240px; }
.seg { display: inline-flex; background: var(--raised); border: 1px solid var(--line-soft); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: .82rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.active-filter { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: .84rem; }
.active-filter button { margin-left: auto; border: 0; background: none; color: var(--accent); font-weight: 650; cursor: pointer; }

.groups { max-height: calc(100vh - 140px); overflow-y: auto; }
@media (max-width: 980px) { .groups { max-height: none; } }
.grp > summary { list-style: none; position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--raised); border-bottom: 1px solid var(--line-soft); cursor: pointer; font-weight: 700; font-size: .84rem; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::before { content: "▸"; color: var(--faint); font-size: .8rem; transition: transform .15s; }
.grp[open] > summary::before { transform: rotate(90deg); }
.grp > summary .n { color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
.grp > summary .mini { margin-left: auto; display: flex; height: 6px; width: 110px; border-radius: 99px; overflow: hidden; background: var(--line-soft); }
.grp > summary .mini i { display: block; height: 100%; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; padding: 10px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; text-align: left; border: 1px solid var(--line-soft); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
.item:hover { border-color: var(--line); box-shadow: var(--shadow); }
.item[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.item .mono { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: .8rem; background: var(--accent-soft); color: var(--accent); grid-row: 1 / span 2; }
.item .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { grid-column: 2; font-size: .78rem; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
.item .ring { grid-row: 1 / span 2; grid-column: 3; }
.ring { --p: 0; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line-soft) 0); display: grid; place-items: center; }
.ring::after { content: attr(data-v); width: 26px; height: 26px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: .62rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.none { padding: 40px; text-align: center; color: var(--muted); }

/* Preview pane */
.preview { position: sticky; top: 12px; padding: 20px; display: grid; gap: 16px; max-height: calc(100vh - 24px); overflow-y: auto; }
.pv-head { display: flex; gap: 12px; align-items: start; }
.pv-head .mono { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; background: var(--accent-soft); color: var(--accent); flex: none; }
.pv-head h2 { font-size: 1.25rem; }
.pv-head p { color: var(--muted); font-size: .86rem; }
.close { margin-left: auto; border: 0; background: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); display: none; }
.facts { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 8px 12px; font-size: .88rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.ciagrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ciagrid div { border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px 10px; background: var(--raised); }
.ciagrid small { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.ciagrid b { font-size: .9rem; }
.ciagrid b.l0 { color: var(--faint); font-weight: 500; font-style: italic; }
.ciagrid b.l3 { color: var(--gold-ink); } .ciagrid b.l4 { color: var(--bad); }
.big { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px; }
.big .ring { width: 56px; height: 56px; }
.big .ring::after { width: 44px; height: 44px; font-size: .82rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats div { border-radius: 10px; background: var(--raised); padding: 8px; }
.stats b { display: block; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: .76rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1; justify-content: center; }
.hint { font-size: .76rem; color: var(--faint); text-align: center; }
.hint kbd { font-family: var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

@media (max-width: 980px) {
  .preview { position: fixed; inset: auto 0 0 0; top: auto; max-height: 82vh; border-radius: 18px 18px 0 0; z-index: 40; transform: translateY(105%); transition: transform .25s ease; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .preview.open { transform: none; }
  .close { display: block; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 39; display: none; }
  .scrim.open { display: block; }
}
@media (max-width: 620px) { .page { padding-inline: 16px; } .items { grid-template-columns: minmax(0, 1fr); } .grp > summary .mini { width: 60px; } }
@media (prefers-reduced-motion: reduce) { .preview { transition: none; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">IS</div>
  <div><b>ISMS</b><small>System onboarding</small></div>
  <nav aria-label="Main"><a href="#">Home</a><a href="#" aria-current="page">Systems</a><a href="#">Controls</a><a href="#">Risks</a><a href="#">Check-ups</a><a href="#">Frameworks</a></nav>
  <div class="proposal-switch">Proposal B · <a href="proposal-a.html">see A</a></div>
</header>

<main class="page">
  <div class="head">
    <div>
      <div class="eyebrow">Proposal B · Portfolio and preview</div>
      <h1>Systems</h1>
      <p>Where onboarding stands, what needs you, and every system grouped so you can scan it.</p>
    </div>
    <a class="btn primary" href="#">+ New System</a>
  </div>

  <section class="overview">
    <div class="panel pipe">
      <div class="pipe-top"><div><b id="tot" class="num"></b> <span>systems</span></div><span id="pct"></span></div>
      <div class="stages" id="stages"></div>
    </div>
    <div class="panel attn">
      <h2>Needs attention</h2>
      <div id="alerts" style="display:grid;gap:8px"></div>
    </div>
  </section>

  <section class="split">
    <div class="panel listpanel">
      <div class="lbar">
        <label class="search">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
          <input id="q" type="search" placeholder="Find a system, vendor or owner" aria-label="Search systems">
          <kbd>/</kbd>
        </label>
        <div class="seg" role="group" aria-label="Group by" id="seg">
          <button data-g="unit" aria-pressed="true">Business Unit</button>
          <button data-g="owner" aria-pressed="false">Owner</button>
          <button data-g="status" aria-pressed="false">Status</button>
          <button data-g="az" aria-pressed="false">A–Z</button>
        </div>
      </div>
      <div class="active-filter" id="af" hidden><span id="afText"></span><button id="afClear">Show all</button></div>
      <div class="groups" id="groups"></div>
    </div>
    <div class="scrim" id="scrim"></div>
    <aside class="panel preview" id="preview" aria-live="polite"></aside>
  </section>
</main>

<script src="data.js"></script>
<script>
(function () {
  const { systems, STATUSES, LEVELS, fmtAgo, initials, esc, statusOf, now } = window.SYS;
  const TONE = { neutral: 'var(--faint)', warn: 'var(--gold)', success: 'var(--ok)', done: 'var(--done)', danger: 'var(--bad)' };
  const ALERTS = [
    { key: 'q', ic: 'w', sym: '?', text: (n, m) => `<b>${m}</b> open questions on <b>${n}</b> systems`, test: (s) => s.questions > 0, sum: (l) => l.reduce((a, s) => a + s.questions, 0) },
    { key: 'idle', ic: 'n', sym: '⏸', text: (n) => `<b>${n}</b> drafts untouched for 60+ days`, test: (s) => s.status === 'DRAFT' && (now - s.updated) > 60 * 864e5 },
    { key: 'cls', ic: 'n', sym: '◌', text: (n) => `<b>${n}</b> systems not fully classified`, test: (s) => !s.c || !s.i || !s.a },
    { key: 'rej', ic: 'd', sym: '!', text: (n) => `<b>${n}</b> rejected, waiting for changes`, test: (s) => s.status === 'REJECTED' }
  ];
  const st = { q: '', group: 'unit', filter: null, sel: systems[0].id, open: new Set() };
  const $ = (id) => document.getElementById(id);
  const lvl = (v) => Math.max(0, LEVELS.indexOf(v));
  const pct = (s) => Math.round(100 * s.fulfilled / s.controls);
  const mono = (n) => n.replace(/[^A-Za-z0-9 ]/g, '').split(' ').filter(Boolean).map((p) => p[0]).join('').slice(0, 2).toUpperCase();

  function filtered() {
    let l = systems;
    if (st.filter) l = l.filter(st.filter.test);
    if (st.q) { const q = st.q.toLowerCase(); l = l.filter((s) => (s.name + ' ' + (s.vendor || '') + ' ' + s.owner).toLowerCase().includes(q)); }
    return l;
  }
  function renderOverview() {
    $('tot').textContent = systems.length;
    const onb = systems.filter((s) => s.status === 'ONBOARDED').length;
    $('pct').textContent = `${Math.round(100 * onb / systems.length)}% onboarded`;
    $('stages').innerHTML = STATUSES.map((x) => {
      const n = systems.filter((s) => s.status === x.key).length;
      return `<button class="stage" data-stage="${x.key}" aria-pressed="${st.filter?.key === 'st-' + x.key}"><span class="lbl"><span class="dot ${x.tone}"></span>${x.label}</span><span class="n">${n}</span><span class="bar"><i style="width:${100 * n / systems.length}%;background:${TONE[x.tone]}"></i></span></button>`;
    }).join('');
    $('alerts').innerHTML = ALERTS.map((a) => {
      const l = systems.filter(a.test);
      return `<button class="alert" data-alert="${a.key}" aria-pressed="${st.filter?.key === a.key}"><span class="ic ${a.ic}">${a.sym}</span><span>${a.text(l.length, a.sum ? a.sum(l) : 0)}</span><span class="go">›</span></button>`;
    }).join('');
  }
  function keysOf(s) {
    if (st.group === 'unit') return s.units;
    if (st.group === 'owner') return [s.owner];
    if (st.group === 'status') return [statusOf(s.status).label];
    return [s.name[0].toUpperCase()];
  }
  function item(s) {
    const so = statusOf(s.status);
    return `<button class="item" data-id="${s.id}" aria-current="${st.sel === s.id}">
      <span class="mono">${mono(s.name)}</span>
      <span class="t">${esc(s.name)}</span>
      <span class="s"><span class="dot ${so.tone}"></span>${so.label} · ${esc(s.owner.split(' ')[0])}${s.questions ? ` <span class="qbadge">? ${s.questions}</span>` : ''}</span>
      <span class="ring" style="--p:${pct(s)}" data-v="${pct(s)}%" title="${s.fulfilled} of ${s.controls} controls fulfilled"></span></button>`;
  }
  function renderList() {
    const l = filtered();
    $('af').hidden = !st.filter;
    if (st.filter) $('afText').innerHTML = `Showing <b>${l.length}</b>: ${st.filter.label}`;
    if (!l.length) { $('groups').innerHTML = `<div class="none">No systems match “${esc(st.q)}”.</div>`; return; }
    const g = new Map();
    l.forEach((s) => keysOf(s).forEach((k) => { if (!g.has(k)) g.set(k, []); g.get(k).push(s); }));
    const order = st.group === 'status' ? STATUSES.map((x) => x.label).filter((k) => g.has(k)) : [...g.keys()].sort();
    const autoOpen = st.q || st.filter || order.length <= 3;
    $('groups').innerHTML = order.map((k, i) => {
      const items = g.get(k).sort((a, b) => a.name.localeCompare(b.name));
      const mini = STATUSES.map((x) => { const n = items.filter((s) => s.status === x.key).length; return n ? `<i style="width:${100 * n / items.length}%;background:${TONE[x.tone]}"></i>` : ''; }).join('');
      const open = autoOpen || st.open.has(k) || (st.open.size === 0 && i < 2);
      return `<details class="grp" data-k="${esc(k)}" ${open ? 'open' : ''}><summary>${esc(k)} <span class="n">${items.length}</span><span class="mini" title="Status mix">${mini}</span></summary><div class="items">${items.map(item).join('')}</div></details>`;
    }).join('');
  }
  function renderPreview() {
    const s = systems.find((x) => x.id === st.sel);
    const so = statusOf(s.status);
    const cia = [['Confidentiality', s.c], ['Integrity', s.i], ['Availability', s.a]].map(([n, v]) => `<div><small>${n}</small><b class="l${lvl(v)}">${v ? v[0] + v.slice(1).toLowerCase() : 'Not set'}</b></div>`).join('');
    $('preview').innerHTML = `
      <div class="pv-head"><span class="mono">${mono(s.name)}</span><div><h2>${esc(s.name)}</h2><p>${s.vendor ? esc(s.vendor) : 'Built in-house'} · updated ${fmtAgo(s.updated)}</p></div><button class="close" id="close" aria-label="Close preview">✕</button></div>
      <dl class="facts">
        <dt>Status</dt><dd><span class="chip ${so.tone}">${so.label}</span>${s.provider ? '<span class="prov">Provider</span>' : ''}</dd>
        <dt>Owner</dt><dd><span class="av">${initials(s.owner)}</span>${esc(s.owner)}</dd>
        <dt>Deployment</dt><dd>${s.facets.map((k) => `<span class="facet">${SYS.facetOf(k).label}</span>`).join('')}</dd>
        <dt>Business Units</dt><dd>${s.units.map(esc).join(', ')}</dd>
      </dl>
      <div class="ciagrid">${cia}</div>
      <div class="big"><span class="ring" style="--p:${pct(s)}" data-v="${pct(s)}%"></span><div><b>${s.fulfilled} of ${s.controls}</b> controls fulfilled<br><span class="muted" style="font-size:.84rem">${s.controls - s.fulfilled} still to answer or evidence</span></div></div>
      <div class="stats"><div><b>${s.questions}</b><small>open questions</small></div><div><b>${s.risks}</b><small>open risks</small></div><div><b>${s.units.length}</b><small>units using it</small></div></div>
      <div class="actions"><a class="btn primary" href="#">Open system</a><a class="btn" href="#">${s.status === 'DRAFT' || s.status === 'REJECTED' ? 'Continue onboarding' : 'View controls'}</a></div>
      <p class="hint"><kbd>↑</kbd> <kbd>↓</kbd> move between systems · <kbd>/</kbd> search</p>`;
    $('close').onclick = closeSheet;
  }
  const closeSheet = () => { $('preview').classList.remove('open'); $('scrim').classList.remove('open'); };
  function select(id, fromClick) {
    st.sel = id;
    document.querySelectorAll('.item').forEach((el) => el.setAttribute('aria-current', el.dataset.id === id));
    renderPreview();
    if (fromClick && matchMedia('(max-width: 980px)').matches) { $('preview').classList.add('open'); $('scrim').classList.add('open'); }
  }
  function render() { renderOverview(); renderList(); renderPreview(); }

  document.addEventListener('click', (e) => {
    const t = e.target;
    const stg = t.closest('[data-stage]');
    if (stg) { const k = 'st-' + stg.dataset.stage; st.filter = st.filter?.key === k ? null : { key: k, label: statusOf(stg.dataset.stage).label, test: (s) => s.status === stg.dataset.stage }; return render(); }
    const al = t.closest('[data-alert]');
    if (al) { const a = ALERTS.find((x) => x.key === al.dataset.alert); st.filter = st.filter?.key === a.key ? null : { key: a.key, label: al.textContent.replace(/[?⏸◌!›]/g, '').trim(), test: a.test }; return render(); }
    if (t.closest('#afClear')) { st.filter = null; return render(); }
    const g = t.closest('[data-g]');
    if (g) { st.group = g.dataset.g; st.open.clear(); document.querySelectorAll('#seg button').forEach((b) => b.setAttribute('aria-pressed', b === g)); return renderList(); }
    const it = t.closest('.item'); if (it) return select(it.dataset.id, true);
    if (t.id === 'scrim') closeSheet();
  });
  document.addEventListener('toggle', (e) => { const d = e.target; if (d.classList?.contains('grp')) d.open ? st.open.add(d.dataset.k) : st.open.delete(d.dataset.k); }, true);
  $('q').addEventListener('input', (e) => { st.q = e.target.value; renderList(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('q').focus(); return; }
    if (e.key === 'Escape') closeSheet();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const items = [...document.querySelectorAll('.grp[open] .item')];
      if (!items.length) return;
      e.preventDefault();
      let i = items.findIndex((el) => el.dataset.id === st.sel);
      i = e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
      select(items[i].dataset.id); items[i].focus({ preventScroll: false }); items[i].scrollIntoView({ block: 'nearest' });
    }
  });
  render();
})();
</script>
</body>
</html>
