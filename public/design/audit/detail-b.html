<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Internal Audit: Matrix</title>
<link rel="stylesheet" href="../systems/systems.css">
<link rel="stylesheet" href="../shared/appbar.css">
<link rel="stylesheet" href="audit.css">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="../shared/themes.css">
<script src="../shared/themes.js"></script>
<style>
/* One Internal Audit, proposal B: a matrix. Rows are the audit's Controls, columns its Systems plus the
   Organization; each cell is one Check-up, coloured by state (not answered, overdue, awaiting evaluation,
   Conforming, Observation, Nonconformity, withdrawn). An empty cell means the Control doesn't apply there.
   Row and column totals show where the gaps are; clicking a cell opens the Check-up in a side panel. A draft
   shows its read view with the launch preview. */
.mx-wrap { overflow: auto; max-height: 70vh; }
table.mx { border-collapse: separate; border-spacing: 0; font-size: .8rem; }
.mx th, .mx td { padding: 4px; border-bottom: 1px solid var(--line-soft); }
.mx thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); vertical-align: bottom; height: 130px; }
.mx thead th span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-weight: 650; color: var(--muted); max-height: 124px; overflow: hidden; text-overflow: ellipsis; }
.mx thead th.org span { color: #8a5cc2; }
.mx tbody th { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; font-weight: 600; min-width: 260px; max-width: 300px; padding-right: 12px; }
.mx tbody th small { display: block; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mx thead th:first-child { left: 0; z-index: 3; text-align: left; }
.cell { all: unset; box-sizing: border-box; display: block; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
.cell:hover { transform: scale(1.12); } .cell:focus-visible { outline: 2px solid var(--accent); }
.cell[aria-pressed="true"] { border-color: var(--ink); }
.cell.none { background: repeating-linear-gradient(45deg, transparent 0 4px, var(--line-soft) 4px 5px); cursor: default; }
.cell.dim { opacity: .18; }
.tot { color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; font-size: .74rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--muted); padding: 10px 18px; border-bottom: 1px solid var(--line-soft); }
.legend button { all: unset; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.legend button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.legend i { width: 12px; height: 12px; border-radius: 3px; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.mgrid > aside { position: sticky; top: 76px; }
@media (max-width: 980px) { .mgrid { grid-template-columns: 1fr; } .mgrid > aside { position: static; } }
</style>
</head>
<body>
<header id="appbar"></header>
<main class="app" id="page"></main>
<script src="../shared/kit.js"></script>
<script src="../controls/data.js"></script>
<script src="../systems/data.js"></script>
<script src="audit.js"></script>
<script src="audits.js"></script>
<script src="detail.js"></script>
<script src="../shared/appbar.js"></script>
<script>
(function () {
  const A = window.AUD, S = window.AUDS, D = window.AUDD, { esc } = A;
  const ui = { sel: null, only: null, id: null };
  const KEYS = [['notAnswered', 'Not answered', 'var(--line)'], ['overdue', 'Overdue', 'var(--bad)'], ['awaiting', 'Awaiting evaluation', 'var(--gold)'], ['CONFORMING', 'Conforming', 'var(--ok)'], ['OBSERVATION', 'Observation', 'var(--gold-ink)'], ['NONCONFORMITY', 'Nonconformity', 'var(--bad)'], ['withdrawn', 'Withdrawn', 'var(--faint)']];
  const keyOf = (c) => c.outcome || S.cuState(c).key;
  const colorOf = (c) => KEYS.find((k) => k[0] === keyOf(c))[2];

  function render(a) {
    if (ui.id !== a.id) { ui.id = a.id; ui.sel = null; ui.only = null; }
    if (a.status === 'DRAFT') return D.hero(a, null) + D.draftBody(a);
    const st = S.stats(a);
    const cols = [...a.systems.map((id) => ({ key: id, name: A.bySys.get(id).name })), ...(a.org ? [{ key: 'org', name: 'Organization', org: true }] : [])];
    const at = new Map(a.checkUps.map((c) => [`${c.code}|${c.target.kind === 'org' ? 'org' : c.target.id}`, c]));
    const sel = a.checkUps.find((c) => c.id === ui.sel);
    const done = (cs) => cs.filter((c) => c.outcome || c.withdrawn).length;
    const head = `<tr><th><span style="writing-mode:horizontal-tb;transform:none">Control \\ where</span></th>${cols.map((c) => `<th class="${c.org ? 'org' : ''}" title="${esc(c.name)}"><span>${esc(c.name)}</span></th>`).join('')}<th><span>Done</span></th></tr>`;
    const body = a.codes.map((code) => {
      const ctl = A.byCode.get(code), cs = [];
      const cells = cols.map((col) => { const c = at.get(`${code}|${col.key}`); if (!c) return '<td><span class="cell none" title="Doesn\'t apply"></span></td>'; cs.push(c);
        const s = S.cuState(c); return `<td><button type="button" class="cell ${ui.only && keyOf(c) !== ui.only ? 'dim' : ''}" data-cu="${c.id}" aria-pressed="${ui.sel === c.id}" style="background:${colorOf(c)}" title="${esc(code)} · ${esc(col.name)}: ${esc(s.label)}"></button></td>`; }).join('');
      return `<tr><th><span class="code">${esc(code)}</span> ${esc(ctl.title)}<small>${esc(ctl.owner || 'No Control Owner')}</small></th>${cells}<td class="tot">${done(cs)}/${cs.length}</td></tr>`;
    }).join('');
    const foot = `<tr><th style="color:var(--muted)">Done per System</th>${cols.map((col) => { const cs = a.checkUps.filter((c) => (c.target.kind === 'org' ? 'org' : c.target.id) === col.key); return `<td class="tot">${done(cs)}/${cs.length}</td>`; }).join('')}<td class="tot"><b>${st.evaluated + st.withdrawn}/${st.total}</b></td></tr>`;
    const count = (k) => a.checkUps.filter((c) => keyOf(c) === k).length;
    return D.hero(a, st) + D.closeBanner(a, st) + `<div class="mgrid"><section class="card" aria-label="Check-ups by Control and System">
        <div class="card-h"><h2>Check-ups</h2><p>${a.codes.length} Controls × ${cols.length} places · each square is one Check-up; hatched means the Control doesn't apply there</p></div>
        <div class="legend" role="group" aria-label="Highlight a state">${KEYS.map(([k, l, c]) => `<button type="button" data-only="${k}" aria-pressed="${ui.only === k}"><i style="background:${c}"></i>${l} <b>${count(k)}</b></button>`).join('')}</div>
        <div class="mx-wrap"><table class="mx"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div></section>
      <aside class="card" aria-label="Check-up"><div class="card-h"><h2>Check-up</h2><p>${sel ? '' : 'click a square'}</p></div><div class="card-b">${sel ? D.checkUpPanel(a, sel) : `<p class="muted">Each square is one Check-up: a Control on a System or on the Organization. Click one to read its response${S.isAuditor() && a.status === 'LAUNCHED' ? ', evaluate it or withdraw it' : ''}.</p>`}</div></aside></div>`;
  }

  const draw = D.mount(render, 'B', [['A', 'detail-a.html'], ['C', 'detail-c.html']]);
  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-cu]'); if (c) { ui.sel = c.dataset.cu; draw(); }
    const o = e.target.closest('[data-only]'); if (o) { ui.only = ui.only === o.dataset.only ? null : o.dataset.only; draw(); }
  });
})();
</script>
</body>
</html>
