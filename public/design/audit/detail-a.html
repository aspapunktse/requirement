<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Internal Audit: Command center</title>
<link rel="stylesheet" href="../systems/systems.css">
<link rel="stylesheet" href="../shared/appbar.css">
<link rel="stylesheet" href="audit.css">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="../shared/themes.css">
<script src="../shared/themes.js"></script>
<style>
/* One Internal Audit, proposal A: the Home command center. The hero carries a ring of the Check-ups by
   state; stat cards filter them (Not answered, Awaiting evaluation, Overdue, Evaluated, Withdrawn); a card
   groups them by Control, System or recipient (tabs with counts), and the picked Check-up opens in a panel
   beside it with its questions, response and evaluation. A banner says whether the audit can close; a closed
   audit shows its findings above the same list. A draft shows its read view with the launch preview. */
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.dgrid > aside { position: sticky; top: 76px; }
@media (max-width: 980px) { .dgrid { grid-template-columns: 1fr; } .dgrid > aside { position: static; } }
.grp { border-bottom: 1px solid var(--line-soft); }
.grp > h3 { display: flex; gap: 8px; align-items: center; font-size: .86rem; padding: 12px 18px 6px; }
.grp > h3 small { margin-left: auto; color: var(--faint); font-weight: 600; font-size: .76rem; }
.cu { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 8px 18px; cursor: pointer; font-size: .85rem; }
.cu:hover { background: var(--raised); } .cu[aria-current="true"] { background: var(--accent-soft); }
.cu:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cu .dot { width: 10px; height: 10px; border-radius: 3px; }
.cu small { display: block; color: var(--muted); font-size: .76rem; }
</style>
</head>
<body>
<header id="appbar"></header>
<main class="app" id="page"></main>
<script src="../shared/kit.js"></script>
<script src="../controls/data.js"></script>
<script src="../systems/data.js"></script>
<script src="audit.js"></script>
<script src="audits.js"></script>
<script src="detail.js"></script>
<script src="../shared/appbar.js"></script>
<script>
(function () {
  const A = window.AUD, S = window.AUDS, D = window.AUDD, { esc } = A, Kit = window.Kit;
  const ui = { filter: 'all', by: 'control', sel: null, id: null };
  const BY = {
    control: ['By Control', (c) => c.code, (c) => `<span class="code">${esc(c.code)}</span> ${esc(c.control.title)}`],
    system: ['By System', (c) => c.target.kind === 'org' ? '~org' : c.target.name, (c) => c.target.kind === 'org' ? 'Organization' : esc(c.target.name)],
    recipient: ['By recipient', (c) => c.recipient || '~none', (c) => c.recipient ? esc(c.recipient) : '<span style="color:var(--bad)">No Control Owner</span>'],
  };
  const FILTERS = [['notAnswered', 'Not answered', ''], ['awaiting', 'Awaiting evaluation', 'warn'], ['overdue', 'Overdue', 'danger'], ['evaluated', 'Evaluated', 'ok'], ['withdrawn', 'Withdrawn', '']];
  const match = (c, f) => f === 'all' || (f === 'notAnswered' ? !c.answered && !c.withdrawn : S.cuState(c).key === f);

  function render(a) {
    if (ui.id !== a.id) { ui.id = a.id; ui.filter = 'all'; ui.sel = null; }
    if (a.status === 'DRAFT') return D.hero(a, null) + D.draftBody(a);
    const st = S.stats(a), t = Math.max(1, st.total);
    const ring = `<div class="move">${Kit.ring([[st.evaluated / t, 'var(--ok)'], [st.withdrawn / t, 'var(--faint)'], [st.awaiting / t, 'var(--gold)'], [st.overdue / t, 'var(--bad)']], 92, 10, String(st.open), a.status === 'CLOSED' ? 'open' : 'to do')}
      <ul><li><i style="background:var(--ok)"></i><b>${st.evaluated}</b> evaluated</li><li><i style="background:var(--gold)"></i><b>${st.awaiting}</b> awaiting evaluation</li><li><i style="background:var(--bad)"></i><b>${st.overdue}</b> overdue</li><li><i style="background:var(--line)"></i><b>${st.notAnswered - st.overdue}</b> not answered yet</li><li><i style="background:var(--faint)"></i><b>${st.withdrawn}</b> withdrawn</li></ul></div>`;
    const count = (f) => a.checkUps.filter((c) => match(c, f)).length;
    const stat = ([k, l, tone]) => `<button type="button" class="card stat ${tone}" data-filter="${k}" aria-pressed="${ui.filter === k}"><span class="k">${l}<em>Filter</em></span><span class="v">${count(k)}</span></button>`;
    const list = a.checkUps.filter((c) => match(c, ui.filter));
    const [, key, head] = BY[ui.by];
    const groups = new Map(); for (const c of list) { const k = key(c); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }
    const sel = a.checkUps.find((c) => c.id === ui.sel) || list.find((c) => !c.outcome && !c.withdrawn) || list[0];
    const row = (c) => { const s = S.cuState(c); const sub = ui.by === 'control' ? (c.target.kind === 'org' ? 'Organization' : c.target.name) + ' · ' + (c.recipient || 'no recipient') : ui.by === 'system' ? c.code + ' ' + c.control.title : c.code + ' · ' + (c.target.kind === 'org' ? 'Organization' : c.target.name);
      return `<button type="button" class="cu" data-cu="${c.id}" aria-current="${sel && sel.id === c.id}"><i class="dot" style="background:${S.STATE_COLOR[s.key]}"></i><span>${esc(sub)}${c.answered ? `<small>Answered ${esc(c.answer)} · ${esc(A.fmtDate(c.respondedAt))}</small>` : ''}</span>${S.chip(s.tone, s.label)}</button>`; };
    return D.hero(a, st, ring) + D.closeBanner(a, st)
      + `<section class="stats" aria-label="Filter the Check-ups">${FILTERS.map(stat).join('')}</section>
      <div class="dgrid"><section class="card" aria-label="Check-ups">
        <div class="card-h" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2>Check-ups</h2><p>${list.length} of ${st.total}${ui.filter !== 'all' ? ` · ${FILTERS.find((f) => f[0] === ui.filter)[1]}` : ''}</p></div>${ui.filter !== 'all' ? '<button class="btn" type="button" data-filter="all">Clear filter</button>' : ''}</div>
        <div class="tabs" role="tablist">${Object.entries(BY).map(([k, [l, kf]]) => `<button type="button" role="tab" data-by="${k}" aria-selected="${ui.by === k}">${l}<span class="n">${new Set(list.map(kf)).size}</span></button>`).join('')}</div>
        ${list.length ? [...groups.entries()].sort((x, y) => x[0].localeCompare(y[0])).map(([, cs]) => { const done = cs.filter((c) => c.outcome || c.withdrawn).length; return `<div class="grp"><h3>${head(cs[0])}<small>${done}/${cs.length} done</small></h3>${cs.map(row).join('')}</div>`; }).join('')
          : '<div class="done-state"><h3>No Check-up matches</h3><p>Clear the filter.</p></div>'}
      </section>
      <aside class="card" aria-label="Check-up"><div class="card-h"><h2>Check-up</h2><p>${a.status === 'CLOSED' ? 'read-only' : S.isAuditor() ? 'evaluate or withdraw it here' : 'read only for your role'}</p></div><div class="card-b">${sel ? D.checkUpPanel(a, sel) : '<p class="muted">Pick a Check-up.</p>'}</div></aside></div>`;
  }

  const draw = D.mount(render, 'A', [['B', 'detail-b.html'], ['C', 'detail-c.html']]);
  document.addEventListener('click', (e) => {
    const f = e.target.closest('[data-filter]'); if (f) { ui.filter = ui.filter === f.dataset.filter ? 'all' : f.dataset.filter; ui.sel = null; draw(); }
    const b = e.target.closest('[data-by]'); if (b) { ui.by = b.dataset.by; draw(); }
    const c = e.target.closest('[data-cu]'); if (c) { ui.sel = c.dataset.cu; draw(); }
  });
})();
</script>
</body>
</html>
