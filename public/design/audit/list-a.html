<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Internal Audits: Command center</title>
<link rel="stylesheet" href="../systems/systems.css">
<link rel="stylesheet" href="../shared/appbar.css">
<link rel="stylesheet" href="audit.css">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="../shared/themes.css">
<script src="../shared/themes.js"></script>
<style>
/* Audits list, proposal A: the Home command center. A hero with a ring of every open Check-up across the
   launched audits, stat cards that filter, then a lane per state (Launched, Drafts, Closed) of audit cards.
   A launched card shows its progress bar (evaluated, awaiting evaluation, answered, overdue) and due date;
   a closed one its findings; a draft what launching it would generate. */
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tools .search { flex: 1 1 240px; }
.lanes { display: grid; gap: 20px; }
.lane { display: grid; gap: 10px; }
.lane > h2 { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.lane > h2 i { width: 8px; height: 8px; border-radius: 50%; }
.lane > h2 small { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--faint); margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.ac { display: grid; gap: 10px; padding: 16px 18px; align-content: start; text-decoration: none; color: inherit; }
.ac:hover { border-color: var(--accent); }
.ac-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ac h3 { font-size: 1.02rem; }
.ac .scope { color: var(--muted); font-size: .85rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 1.2em; }
.ac .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); }
.ac .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 8px; border-radius: 99px; background: var(--line-soft); overflow: hidden; }
.bar i { display: block; height: 100%; }
.ac .foot { display: flex; justify-content: space-between; gap: 8px; align-items: center; border-top: 1px solid var(--line-soft); padding-top: 10px; font-size: .82rem; }
.due.late { color: var(--bad); font-weight: 700; } .due.soon { color: var(--gold-ink); font-weight: 700; }
.ready-tag { color: var(--ok); font-weight: 700; }
.find { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<header id="appbar"></header>
<main class="app" id="page"></main>
<script src="../shared/kit.js"></script>
<script src="../controls/data.js"></script>
<script src="../systems/data.js"></script>
<script src="audit.js"></script>
<script src="audits.js"></script>
<script src="../shared/appbar.js"></script>
<script>
(function () {
  const A = window.AUD, S = window.AUDS, { esc } = A, Kit = window.Kit;
  const ui = { filter: 'all', q: '' };
  const href = (a) => `detail-a.html?id=${a.id}${location.hash}`;

  function bar(st) {
    const t = Math.max(1, st.total), seg = [['evaluated', st.evaluated], ['withdrawn', st.withdrawn], ['awaiting', st.awaiting], ['overdue', st.overdue]];
    return `<div class="bar" role="img" aria-label="${st.evaluated} evaluated, ${st.awaiting} awaiting evaluation, ${st.overdue} overdue of ${st.total}">${seg.map(([k, n]) => `<i style="width:${n / t * 100}%;background:${S.STATE_COLOR[k]}"></i>`).join('')}</div>`;
  }
  function card(a) {
    const st = S.stats(a), n = A.daysUntil(a.due);
    let body = '', foot = '';
    if (a.status === 'LAUNCHED') {
      body = `${bar(st)}<div class="meta"><span><b>${st.evaluated}</b> of ${st.total} evaluated</span><span><b>${st.awaiting}</b> awaiting evaluation</span>${st.overdue ? `<span style="color:var(--bad)"><b style="color:inherit">${st.overdue}</b> overdue</span>` : ''}</div>`;
      foot = `<span class="due ${n < 0 ? 'late' : n <= 7 ? 'soon' : ''}">${esc(S.dueText(a))}</span>${st.canClose ? '<span class="ready-tag">Ready to close</span>' : `<span class="muted">${st.open} open</span>`}`;
    } else if (a.status === 'DRAFT') {
      const p = S.plan(a);
      body = `<div class="meta"><span><b>${a.codes.length}</b> Controls</span><span><b>${a.systems.length}</b> Systems${a.org ? ' + Organization' : ''}</span><span>would send <b>${p.total}</b> Check-ups</span></div>`;
      foot = `<span class="muted">Due ${esc(A.fmtDate(a.due))}</span>${p.launch.length ? S.chip('warn', p.launch[0].text) : '<span class="ready-tag">Ready to launch</span>'}`;
    } else {
      body = `<div class="find">${S.chip('success', `${st.CONFORMING} Conforming`)}${S.chip('warn', `${st.OBSERVATION} Observation`)}${S.chip('danger', `${st.NONCONFORMITY} Nonconformity`)}</div>`;
      foot = `<span class="muted">Closed ${esc(A.fmtDate(a.closedAt))} by ${esc(a.closedBy)}</span><span class="muted">${S.plural(st.risks, 'Risk')} opened</span>`;
    }
    return `<a class="card ac spot" href="${href(a)}"><div class="ac-top"><h3>${esc(a.title)}</h3>${S.chip(S.STATUS[a.status].tone, S.STATUS[a.status].label)}</div>
      <p class="scope">${a.scope ? esc(a.scope) : '<span style="color:var(--faint)">No scope description</span>'}</p>${body}<div class="foot">${foot}</div></a>`;
  }

  function render() {
    const root = document.getElementById('page');
    if (!S.canRead()) { root.innerHTML = S.roleNote(); return; }
    const all = S.audits, launched = all.filter((a) => a.status === 'LAUNCHED');
    const sum = launched.reduce((o, a) => { const s = S.stats(a); ['total', 'evaluated', 'withdrawn', 'awaiting', 'overdue', 'notAnswered'].forEach((k) => (o[k] += s[k])); return o; }, { total: 0, evaluated: 0, withdrawn: 0, awaiting: 0, overdue: 0, notAnswered: 0 });
    const open = sum.total - sum.evaluated - sum.withdrawn, t = Math.max(1, sum.total);
    const tests = {
      all: () => true, DRAFT: (a) => a.status === 'DRAFT', LAUNCHED: (a) => a.status === 'LAUNCHED', CLOSED: (a) => a.status === 'CLOSED',
      awaiting: (a) => a.status === 'LAUNCHED' && S.stats(a).awaiting > 0, overdue: (a) => a.status === 'LAUNCHED' && S.stats(a).overdue > 0,
    };
    const count = (k) => all.filter(tests[k]).length;
    const awaitingN = launched.reduce((n, a) => n + S.stats(a).awaiting, 0), overdueN = launched.reduce((n, a) => n + S.stats(a).overdue, 0);
    const stat = (k, label, v, tone) => `<button type="button" class="card stat ${tone || ''}" data-filter="${k}" aria-pressed="${ui.filter === k}"><span class="k">${label}<em>Filter</em></span><span class="v">${v}</span></button>`;
    const shown = all.filter(tests[ui.filter]).filter((a) => !ui.q || (a.title + ' ' + a.scope).toLowerCase().includes(ui.q));
    const lane = (title, tone, status, note) => { const arr = shown.filter((a) => a.status === status); return arr.length ? `<section class="lane" aria-label="${title}"><h2><i style="background:${tone}"></i>${title} <span class="num">${arr.length}</span><small>${note}</small></h2><div class="grid">${arr.map(card).join('')}</div></section>` : ''; };
    root.innerHTML = `
      <section class="hero" aria-labelledby="pageH"><div>
        <div class="eyebrow">Assurance</div><h1 id="pageH">Internal Audits</h1>
        <p class="lede">Verify that Controls work: an Internal Auditor plans an audit as a draft, launches it to send one Check-up per recipient and Control, evaluates the answers and closes it.</p>
        <div class="chips">${S.isAuditor() ? `<a class="btn primary" href="proposal-a.html${location.hash}">+ New Internal Audit</a>` : `<span class="muted" style="font-size:.84rem">You read Internal Audits; only an Internal Auditor plans and runs them.</span>`}</div></div>
        <div class="move">${Kit.ring([[sum.evaluated / t, 'var(--ok)'], [sum.withdrawn / t, 'var(--faint)'], [sum.awaiting / t, 'var(--gold)'], [sum.overdue / t, 'var(--bad)']], 92, 10, String(open), 'open')}
          <ul><li><i style="background:var(--ok)"></i><b>${sum.evaluated}</b> evaluated</li><li><i style="background:var(--gold)"></i><b>${sum.awaiting}</b> awaiting evaluation</li><li><i style="background:var(--bad)"></i><b>${sum.overdue}</b> overdue</li><li><i style="background:var(--line)"></i><b>${sum.notAnswered - sum.overdue}</b> not answered yet</li></ul></div>
      </section>
      <section class="stats" aria-label="Filter the audits">${stat('LAUNCHED', 'Launched', count('LAUNCHED'), 'ok')}${stat('awaiting', 'Awaiting evaluation', awaitingN, 'warn')}${stat('overdue', 'Overdue Check-ups', overdueN, 'danger')}${stat('DRAFT', 'Drafts', count('DRAFT'))}${stat('CLOSED', 'Closed', count('CLOSED'))}</section>
      <div class="tools"><label class="search"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.6"/></svg><input id="q" type="search" placeholder="Search audits by title or scope" aria-label="Search audits" value="${esc(ui.q)}"><kbd>/</kbd></label>
        ${ui.filter !== 'all' ? `<button class="btn" type="button" data-filter="all">Clear filter</button>` : ''}</div>
      <div class="lanes">${lane('Launched', 'var(--ok)', 'LAUNCHED', 'soonest due first')}${lane('Drafts', 'var(--faint)', 'DRAFT', 'nothing sent yet')}${lane('Closed', 'var(--done)', 'CLOSED', 'read-only')}
        ${shown.length ? '' : '<section class="card"><div class="done-state"><h3>No audit matches</h3><p>Clear the filter or the search.</p></div></section>'}</div>`;
    const q = document.getElementById('q'); q.oninput = (e) => { ui.q = e.target.value.toLowerCase(); render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  }
  S.audits.sort((a, b) => a.due.localeCompare(b.due) * (a.status === 'CLOSED' ? -1 : 1));
  document.addEventListener('click', (e) => { const f = e.target.closest('[data-filter]'); if (f) { ui.filter = ui.filter === f.dataset.filter ? 'all' : f.dataset.filter; render(); } });
  document.addEventListener('keydown', (e) => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('q').focus(); } });
  addEventListener('appbar:role', render);
  Appbar.mount({ current: 'audits', proposal: { label: 'A', siblings: [['B', 'list-b.html']] }, items: S.paletteItems(href) });
  render();
})();
</script>
</body>
</html>
