<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Organization Controls Register</title>
<link rel="stylesheet" href="../systems/systems.css">
<link rel="stylesheet" href="../shared/appbar.css">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="org.css">
<style>
/* Proposal A: the Organization's Controls as a register, in the Home / Frameworks look.
   A hero ring of implementation status, stat cards that filter (Mine among them, the link from a
   Control Owner's home tasks), tabs per Annex A theme, then a table whose row opens an editor
   in place with what the status does for Systems. A Compliance Manager can select rows and set
   one status for all of them, with one reason when it is Waived or Not Applicable. */
.hero a.btn { color: var(--accent); }
.hero .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.reg { overflow: clip; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.toolbar .search { flex: 1 1 240px; max-width: 340px; }
.toolbar .lbl { font-size: .82rem; color: var(--muted); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1080px; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--raised); text-align: left; font-size: .72rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
thead th:first-child, tbody td:first-child { padding-left: 16px; width: 34px; }
tbody td { padding: 11px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
tbody tr.r { cursor: pointer; }
tbody tr.r:hover td { background: var(--raised); }
tbody tr.r[aria-expanded="true"] td { background: var(--accent-soft); border-bottom-color: transparent; }
tbody tr.r.flash td { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--ok) 22%, var(--surface)); } }
.ttl { display: grid; gap: 3px; min-width: 240px; }
.ttl b { font-weight: 650; }
.ttl small { color: var(--faint); font-size: .76rem; }
.ttl .tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.inh { font-size: .72rem; color: var(--done); font-weight: 650; }
td.upd { color: var(--muted); font-size: .8rem; white-space: nowrap; }
td.upd small { display: block; color: var(--faint); }
td.chev { width: 28px; color: var(--faint); text-align: center; }
tr.r[aria-expanded="true"] td.chev { color: var(--accent); transform: rotate(90deg); }
tr.exp > td { background: var(--accent-soft); padding: 4px 16px 18px 50px; border-bottom: 1px solid var(--line); }
.expin { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(240px, 1fr); gap: 18px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; padding: 16px; animation: rise .25s both; }
@media (max-width: 900px) { .expin { grid-template-columns: 1fr; } }
.facts { display: grid; gap: 10px; font-size: .84rem; align-content: start; }
.facts h3 { font-size: .72rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.facts p { color: var(--muted); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; border-left: 2px solid var(--line-soft); padding-left: 12px; }
.hist li { font-size: .8rem; color: var(--muted); position: relative; }
.hist li::before { content: ""; position: absolute; left: -17px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.hist li.now::before { background: var(--accent); }
.grp td { padding: 9px 16px 6px; font-size: .74rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--raised); border-top: 1px solid var(--line-soft); }
.grp td .sbar { display: inline-flex; width: 140px; vertical-align: middle; margin-left: 12px; }
.grp td small { margin-left: 8px; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--faint); }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
.bulk { position: sticky; bottom: 64px; z-index: 5; margin: 0 16px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--ink); color: var(--paper); box-shadow: var(--shadow); animation: rise .2s both; }
.bulk .btn { border-color: transparent; }
.bulk .btn.ghost { color: var(--paper); }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line-soft); font-size: .82rem; color: var(--muted); }
</style>
</head>
<body>
<header id="appbar"></header>
<main class="app">
  <section class="hero" aria-labelledby="h1">
    <div>
      <p class="eyebrow">Organization</p>
      <h1 id="h1">Organization Control Implementations</h1>
      <p class="lede" id="lede"></p>
      <div class="actions"><button class="btn" type="button" onclick="Kit.toast('organization-controls.csv downloaded')">Download CSV</button><a class="btn ghost" href="/design/soa/proposal-a.html" data-keep-role>Statement of Applicability →</a></div>
    </div>
    <div class="move" id="move"></div>
  </section>

  <section class="stats" id="stats" aria-label="Views"></section>

  <section class="card reg" aria-label="Organization Controls">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="toolbar">
      <label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4a5 5 0 1 0 0 10A5 5 0 0 0 9 4zM13 13l4 4"/></svg>
        <input id="q" type="search" placeholder="Search code, title or description" aria-label="Search Controls"><kbd>/</kbd></label>
      <div class="seg" id="app" role="group" aria-label="Applies to"><button type="button" data-a="all" aria-pressed="true">All</button><button type="button" data-a="ORGANIZATIONAL" aria-pressed="false">Organizational</button><button type="button" data-a="BOTH" aria-pressed="false">Both</button></div>
      <span class="grow"></span>
      <span class="lbl">Group by</span>
      <div class="seg" id="grp" role="group" aria-label="Group by"><button type="button" data-g="status" aria-pressed="true">Status</button><button type="button" data-g="owner" aria-pressed="false">Owner</button><button type="button" data-g="none" aria-pressed="false">None</button></div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th><input type="checkbox" id="all" aria-label="Select all shown"></th><th>Code</th><th>Control</th><th>Control Owner</th><th>Status</th><th>Description</th><th>Last updated</th><th><span class="sr">Open</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="bulk" id="bulk" hidden></div>
    <div class="foot"><span id="count"></span><span id="lg"></span></div>
  </section>
</main>

<dialog id="bulkDlg"><form method="dialog" class="in" id="bulkForm"></form></dialog>

<script src="../controls/data.js"></script>
<script src="../shared/kit.js"></script>
<script src="../shared/appbar.js"></script>
<script src="org.js"></script>
<script>
const { ROWS, STATUSES, esc } = ORG;
const mineParam = new URLSearchParams(location.search).get('mine') === '1';
const S = { view: mineParam ? 'mine' : 'all', theme: 'all', q: '', app: 'all', group: 'status', open: null, sel: new Set(), flash: null };
const VIEWS = () => [
  ['all', 'All Controls', () => true, ''],
  ['mine', 'Controls I own', ORG.isMine, ''],
  ['NOT_STARTED', 'Not Started', (r) => r.status === 'NOT_STARTED', 'warn'],
  ['reasoned', 'Waived or N/A', (r) => ORG.NEEDS_REASON.includes(r.status), ''],
  ['noowner', 'No Control Owner', (r) => !r.owner, 'danger'],
];
// Status views the hero ring's legend opens; they have no stat card of their own
const RING_VIEWS = [['IN_PROGRESS', (r) => r.status === 'IN_PROGRESS'], ['FULFILLED', (r) => r.status === 'FULFILLED']];
const viewFn = (k) => (VIEWS().find((v) => v[0] === k) || [0, 0, (RING_VIEWS.find((v) => v[0] === k) || [0, () => true])[1]])[2];

function renderHero() {
  const c = ORG.counts(), n = ROWS.length, both = ROWS.filter((r) => r.applicability === 'BOTH');
  const bothF = both.filter((r) => r.status === 'FULFILLED');
  document.getElementById('lede').innerHTML = `How the Organization implements its <b>${n}</b> Organizational and Both Controls. <b>${ORG.fulfilledPct()}%</b> are Fulfilled. ${bothF.length} of ${both.length} Both Controls are Fulfilled and inherited by the Systems they apply to; ${c.NOT_STARTED} Controls have not been started.`;
  document.getElementById('move').innerHTML = Kit.ring(STATUSES.filter((s) => s.key !== 'NOT_STARTED').map((s) => [c[s.key] / n, ORG.COLOR[s.key]]), 104, 12, ORG.fulfilledPct() + '%', 'Fulfilled') +
    `<ul>${STATUSES.map((s) => `<li><button type="button" data-view="${s.key === 'WAIVED' || s.key === 'NOT_APPLICABLE' ? 'reasoned' : s.key}" aria-pressed="${S.view === s.key || (S.view === 'reasoned' && ORG.NEEDS_REASON.includes(s.key))}"><i class="s-${s.key}"></i><b>${c[s.key]}</b>${s.label}</button></li>`).join('')}</ul>`;
}
function renderStats() {
  document.getElementById('stats').innerHTML = VIEWS().map(([k, l, fn, tone]) => {
    const n = ROWS.filter(fn).length;
    return `<button type="button" class="card stat spot ${tone}" data-view="${k}" aria-pressed="${S.view === k}"><span class="k">${l}<em>${S.view === k ? 'Showing' : 'Show'}</em></span><span class="v" data-count="${n}">${n}</span></button>`;
  }).join('');
  Kit.countUp(document.getElementById('stats'));
}
const base = () => { const fn = viewFn(S.view); const q = S.q.toLowerCase();
  return ROWS.filter(fn).filter((r) => S.app === 'all' || r.applicability === S.app).filter((r) => !q || `${r.code} ${r.title} ${r.description || ''} ${r.owner || ''}`.toLowerCase().includes(q)); };
function renderTabs() {
  const b = base();
  const tabs = [['all', 'All themes']].concat(ORG.THEMES.map((t) => [t[0], t[1]]));
  document.getElementById('tabs').innerHTML = tabs.map(([k, l]) => `<button role="tab" type="button" data-theme="${k}" aria-selected="${S.theme === k}">${esc(l)} <span class="n">${k === 'all' ? b.length : b.filter((r) => r.theme === k).length}</span></button>`).join('');
}
function row(r) {
  const open = S.open === r.id;
  return `<tr class="r${S.flash === r.id ? ' flash' : ''}" data-id="${esc(r.id)}" aria-expanded="${open}" tabindex="0">
    <td>${ORG.canEdit(r) ? `<input type="checkbox" data-sel="${esc(r.id)}" ${S.sel.has(r.id) ? 'checked' : ''} aria-label="Select ${esc(r.code)}">` : ''}</td>
    <td><span class="code">${esc(r.code)}</span></td>
    <td><div class="ttl"><b>${esc(r.title)}</b><span class="tags">${ORG.applies(r)}${r.applicability === 'BOTH' ? `<span class="inh">${r.status === 'FULFILLED' ? 'inherited by' : 'reaches'} ${r.systems} Systems</span>` : ''}</span></div></td>
    <td>${ORG.owner(r)}</td>
    <td>${ORG.chip(r.status)}</td>
    <td>${r.description ? `<p class="desc">${esc(r.description)}</p>` : '<span class="nodesc">No description</span>'}</td>
    <td class="upd">${r.updatedAt ? `${ORG.fmtDate(r.updatedAt)}<small>by ${esc(r.updatedBy)}</small>` : '—'}</td>
    <td class="chev" aria-hidden="true">›</td></tr>${open ? expRow(r) : ''}`;
}
function expRow(r) {
  return `<tr class="exp"><td colspan="8"><div class="expin"><div>${ORG.editor(r, { next: true })}</div>
    <div class="facts"><div><h3>What it does for Systems</h3><p>${ORG.reach(r)}</p></div>
      <div><h3>The Control</h3><p>${esc(r.summary)}</p></div>
      <div><h3>History</h3>${r.history.length ? `<ul class="hist">${r.history.map((h) => `<li class="${h.now ? 'now' : ''}">${ORG.fmtDate(h.at)} · ${esc(h.by)} set <b>${ORG.statusOf(h.to).label}</b></li>`).join('')}</ul>` : '<p>No implementation recorded yet; it reads as Not Started.</p>'}</div></div></div></td></tr>`;
}
let shown = [];
function renderRows() {
  shown = base().filter((r) => S.theme === 'all' || r.theme === S.theme);
  let html = '';
  if (S.group === 'none') html = shown.map(row).join('');
  else {
    const key = S.group === 'status' ? (r) => r.status : (r) => r.owner || '';
    const order = S.group === 'status' ? STATUSES.map((s) => s.key) : [...new Set(shown.map(key))].sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b));
    order.forEach((k) => {
      const rs = shown.filter((r) => key(r) === k); if (!rs.length) return;
      const label = S.group === 'status' ? ORG.statusOf(k).label : (k || 'No Control Owner');
      html += `<tr class="grp"><td colspan="8">${esc(label)}<small>${rs.length} Control${rs.length === 1 ? '' : 's'}</small>${S.group === 'owner' ? ORG.bar(rs, 'thin') : ''}</td></tr>` + rs.map(row).join('');
    });
  }
  document.getElementById('rows').innerHTML = html || `<tr><td colspan="8"><div class="done-state">${Kit.CHECK}<h3>${S.view === 'mine' ? 'You own no Controls here' : 'No Controls match'}</h3><p>Clear the search or pick another view.</p></div></td></tr>`;
  document.getElementById('count').textContent = `${shown.length} of ${ROWS.length} Controls`;
  const exp = document.querySelector('tr.exp'); if (exp) ORG.bindEditor(exp, onSaved, () => { S.open = null; renderRows(); });
  renderBulk(); S.flash = null;
}
function onSaved(res, next) {
  const i = shown.findIndex((r) => r.id === res.row.id);
  S.flash = res.row.id;
  S.open = next ? (shown.slice(i + 1).find((r) => ORG.canEdit(r)) || {}).id || null : null;
  renderHero(); renderStats(); renderTabs(); renderRows();
  const o = document.querySelector('tr.exp'); if (o) o.querySelector('textarea')?.focus();
}
function renderBulk() {
  const b = document.getElementById('bulk');
  const ids = [...S.sel].filter((id) => ORG.canEdit(ORG.byId(id)));
  b.hidden = !ids.length;
  if (ids.length) b.innerHTML = `<b>${ids.length} selected</b><span class="grow"></span><button class="btn sm" type="button" data-bulk>Set status…</button><button class="btn sm ghost" type="button" data-clear>Clear</button>`;
  const all = document.getElementById('all'); const editable = shown.filter(ORG.canEdit);
  all.checked = editable.length > 0 && editable.every((r) => S.sel.has(r.id)); all.disabled = !editable.length;
}
function openBulk() {
  const ids = [...S.sel];
  const f = document.getElementById('bulkForm');
  f.innerHTML = `<h2>Set the status of ${ids.length} Controls</h2>
    <label class="field">Status<select name="status">${STATUSES.map((s) => `<option value="${s.key}">${s.label}</option>`).join('')}</select></label>
    <label class="field">Description <span class="hint" id="bh">(kept as is when empty)</span><textarea name="description" rows="3" placeholder="Replaces each Control's description"></textarea></label>
    <p class="refuse" id="br"></p>
    <div class="row"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok" id="bok">Apply to ${ids.length}</button></div>`;
  const sync = () => { const need = ORG.NEEDS_REASON.includes(f.status.value); const err = need && !f.description.value.trim(); document.getElementById('bh').textContent = need ? '(required: the reason)' : '(kept as is when empty)'; document.getElementById('br').textContent = err ? 'A description is required to set the status to Waived or Not Applicable.' : ''; document.getElementById('bok').disabled = err; };
  f.oninput = sync; sync();
  const d = document.getElementById('bulkDlg'); d.showModal();
  f.onsubmit = (e) => {
    if (e.submitter?.value !== 'ok') return;
    ids.forEach((id) => { const r = ORG.byId(id); ORG.save(id, f.status.value, f.description.value.trim() || r.description); });
    Kit.toast(`${ids.length} Controls set to ${ORG.statusOf(f.status.value).label}`);
    S.sel.clear(); renderHero(); renderStats(); renderTabs(); renderRows();
  };
}
function renderAll() { S.sel.clear(); renderHero(); renderStats(); renderTabs(); renderRows(); }

document.querySelector('.hero').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) { S.view = S.view === b.dataset.view ? 'all' : b.dataset.view; renderHero(); renderStats(); renderTabs(); renderRows(); } });
document.getElementById('stats').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (!b) return; S.view = S.view === b.dataset.view ? 'all' : b.dataset.view; renderHero(); renderStats(); renderTabs(); renderRows(); });
document.getElementById('tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-theme]'); if (b) { S.theme = b.dataset.theme; renderTabs(); renderRows(); } });
document.getElementById('q').addEventListener('input', (e) => { S.q = e.target.value; renderTabs(); renderRows(); });
const segs = (id, k, fn) => document.getElementById(id).addEventListener('click', (e) => { const b = e.target.closest(`[data-${k}]`); if (!b) return; document.querySelectorAll(`#${id} button`).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); fn(b.dataset[k]); });
segs('app', 'a', (v) => { S.app = v; renderTabs(); renderRows(); });
segs('grp', 'g', (v) => { S.group = v; renderRows(); });
const rows = document.getElementById('rows');
rows.addEventListener('click', (e) => {
  if (e.target.closest('[data-sel]')) { const id = e.target.closest('[data-sel]').dataset.sel; e.target.checked ? S.sel.add(id) : S.sel.delete(id); renderBulk(); return; }
  if (e.target.closest('tr.exp')) return;
  const tr = e.target.closest('tr.r'); if (!tr) return;
  S.open = S.open === tr.dataset.id ? null : tr.dataset.id; renderRows();
  document.querySelector('tr.exp')?.scrollIntoView({ block: 'nearest' });
});
rows.addEventListener('keydown', (e) => { const tr = e.target.closest('tr.r'); if (tr && e.target === tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tr.click(); } });
document.getElementById('all').addEventListener('change', (e) => { shown.filter(ORG.canEdit).forEach((r) => e.target.checked ? S.sel.add(r.id) : S.sel.delete(r.id)); renderRows(); });
document.getElementById('bulk').addEventListener('click', (e) => { if (e.target.closest('[data-bulk]')) openBulk(); if (e.target.closest('[data-clear]')) { S.sel.clear(); renderRows(); } });
document.addEventListener('keydown', (e) => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('q').focus(); } });
document.getElementById('lg').innerHTML = ORG.legend();
addEventListener('appbar:role', renderAll);

Appbar.mount({ current: 'controls', proposal: { label: 'A', siblings: [['B', 'proposal-b.html'], ['C', 'proposal-c.html']] },
  items: ORG.paletteItems((id) => { S.view = 'all'; S.theme = 'all'; S.q = ''; document.getElementById('q').value = ''; S.open = id; renderStats(); renderTabs(); renderRows(); document.querySelector('tr.exp')?.scrollIntoView({ block: 'center' }); }) });
document.querySelectorAll('.hero [data-keep-role]').forEach((a) => { a.href = Appbar.withRole(a.getAttribute('href')); });
renderAll();
</script>
</body>
</html>
