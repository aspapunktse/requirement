<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Compliance Boundaries</title>
<link rel="stylesheet" href="../systems/systems.css">
<link rel="stylesheet" href="../shared/appbar.css">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="../shared/themes.css">
<script src="../shared/themes.js"></script>
<style>
/* Compliance Boundaries, proposal C, "Scope statement first" (#417). Written for the auditor: a Boundary page is a
   document. It opens on a scope statement (who owns it, which Frameworks, which Systems are in and out and why),
   then a perimeter diagram (counted Systems inside, not-yet-operating Systems on the edge, Providers outside with
   inheritance arrows), then the Statement of Applicability sections inline as one continuous document. Membership is
   edited in a side drawer and a join preview reads as a before/after diff of the scope. Views (?view=): list,
   boundary (the document), statement (only its statement part, with export) and system (the fragment on a System
   page). Built on kit.css. */
[hidden] { display: none !important; }
.pv { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .8rem; color: var(--muted); }
.pv .seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.pv .seg a { padding: 4px 11px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 650; white-space: nowrap; }
.pv .seg a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.fine { font-size: .78rem; color: var(--faint); }
.crumbs { font-size: .82rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--accent); text-decoration: none; font-weight: 600; } .crumbs a:hover { text-decoration: underline; }
.person { display: inline-flex; align-items: center; gap: 7px; }
.fwchip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 99px; font-size: .76rem; font-weight: 650; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.fwchip.base { background: var(--raised); color: var(--muted); border: 1px solid var(--line-soft); }
.neutral { background: var(--raised); color: var(--muted); border: 1px solid var(--line-soft); border-radius: 99px; padding: 1px 9px; font-size: .76rem; font-weight: 650; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.btn.sm { padding: 4px 10px; font-size: .8rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: .88rem; }
.banner.warn { background: var(--gold-soft); border-color: transparent; } .banner.retired { background: var(--raised); }
.banner b { display: block; } .banner p { color: var(--muted); margin-top: 2px; }
.dash { font-weight: 760; color: var(--faint); display: grid; place-items: center; border-radius: 50%; border: 5px solid var(--line-soft); flex: none; }

/* The document */
.doc { width: min(940px, 100%); margin-inline: auto; display: grid; gap: 18px; }
.paper { padding: 28px 34px 30px; display: grid; gap: 16px; }
@media (max-width: 640px) { .paper { padding: 20px 18px 22px; } }
.paper .eyebrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.paper h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); letter-spacing: -0.02em; line-height: 1.15; }
.paper h2.sh { font-size: 1.15rem; letter-spacing: -0.01em; display: flex; gap: 10px; align-items: baseline; padding-top: 6px; border-top: 1px solid var(--line-soft); }
.paper h2.sh .no { font-family: var(--mono); font-size: .82rem; color: var(--faint); font-weight: 700; }
.paper h3.sh { font-size: 1rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.paper h3.sh .no { font-family: var(--mono); font-size: .78rem; color: var(--faint); font-weight: 700; margin-right: 8px; }
.paper p.prose { font-size: .96rem; line-height: 1.65; max-width: 74ch; }
.paper p.prose a { color: var(--accent); font-weight: 650; text-decoration: none; } .paper p.prose a:hover { text-decoration: underline; }
.paper p.prose b { font-weight: 680; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 24px; padding: 14px 0; border-block: 1px solid var(--line-soft); }
.meta div small { display: block; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.meta div span { font-size: .92rem; font-weight: 620; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.toc { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.toc a { color: var(--accent); text-decoration: none; font-weight: 650; } .toc a:hover { text-decoration: underline; }

/* Document tables */
.tw { overflow-x: auto; }
table.dt { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 540px; }
.dt th { text-align: left; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 12px 8px 0; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
.dt td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.dt td.k { font-weight: 680; }
.dt td small { display: block; color: var(--muted); font-size: .78rem; }
.pos { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.pos i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.pos.in i { background: var(--accent); } .pos.edge i { background: var(--gold-soft); box-shadow: inset 0 0 0 1.5px var(--gold); }
.pos.closed i { background: var(--line-soft); box-shadow: inset 0 0 0 1.5px var(--faint); } .pos.out i { box-shadow: inset 0 0 0 1.5px var(--line); border-radius: 50%; }
.pos.cand i { box-shadow: inset 0 0 0 1.5px var(--accent); border-radius: 50%; }
.pcrow { display: flex; align-items: center; gap: 12px; }
.pcrow b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }

/* The perimeter diagram */
.peri { background: var(--raised); border: 1px solid var(--line-soft); border-radius: 14px; padding: 8px; }
.peri svg { display: block; width: 100%; height: auto; }
.peri text { font-family: inherit; fill: var(--ink); }
.peri .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); }
.peri .nm { font-size: 13px; font-weight: 680; } .peri .sb { font-size: 10.5px; fill: var(--muted); }
.peri .box { fill: color-mix(in srgb, var(--accent-soft) 45%, transparent); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 8 5; }
.peri .n-in { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
.peri .n-edge { fill: var(--gold-soft); stroke: var(--gold); stroke-width: 1.8; stroke-dasharray: 5 3; }
.peri .n-prov { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.peri .n-ghost { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 3 3; }
.peri .n-cand { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-dasharray: 2 4; opacity: .8; }
.peri .arr { fill: none; stroke: var(--faint); stroke-width: 1.4; }
.peri .strike { text-decoration: line-through; }
.peri-list { display: none; gap: 10px; font-size: .88rem; }
.peri-list ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); display: grid; gap: 3px; }
.peri-list b { font-weight: 680; }
.pkey { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .78rem; color: var(--muted); padding: 8px 8px 4px; }
.pkey span { display: inline-flex; gap: 7px; align-items: center; }
@media (max-width: 700px) { .peri, .pkey { display: none; } .peri-list { display: grid; } }

/* Statement inside the document */
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tools .search { flex: 1 1 220px; }
.fseg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.fseg button { border: 0; background: none; padding: 4px 11px; border-radius: 8px; color: var(--muted); font-weight: 650; font-size: .82rem; cursor: pointer; white-space: nowrap; font-family: inherit; }
.fseg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
tr.rq { cursor: pointer; } tr.rq:hover td { background: var(--raised); } tr.rq.open td { background: var(--accent-soft); }
tr.rq td { padding-left: 4px; }
tr.rq.ex .tt { color: var(--muted); }
.code { font-family: var(--mono); font-size: .78rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tt { font-weight: 620; }
.inc { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 650; border-radius: 99px; padding: 1px 9px 1px 7px; white-space: nowrap; }
.inc::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
.inc.yes { background: var(--ok-soft); color: var(--ok); } .inc.yes::before { background: var(--ok); }
.inc.no { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); } .inc.no::before { box-shadow: inset 0 0 0 1.5px var(--muted); }
.missing { display: inline-flex; align-items: center; gap: 6px; color: var(--bad); font-weight: 650; font-size: .8rem; }
.missing::before { content: "!"; display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: var(--bad-soft); font-size: .68rem; font-weight: 800; }
.jt { font-size: .82rem; color: var(--muted); font-style: italic; }
.bar { display: flex; height: 6px; width: 120px; border-radius: 3px; overflow: hidden; background: var(--line-soft); gap: 1px; margin-top: 5px; }
.bar i { display: block; min-width: 2px; }
tr.dr > td { padding: 0; background: var(--raised); border-bottom: 1px solid var(--line-soft); }
.drill { padding: 14px 14px 18px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.drill h4 { margin: 0 0 8px; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.drill .syl { display: grid; gap: 2px; }
.drill .syl div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line-soft); font-size: .86rem; }
.drill .syl div.off { background: transparent; color: var(--faint); border-style: dashed; }
.drill p { font-size: .84rem; color: var(--muted); }
.editor { display: grid; gap: 8px; }
.editor textarea { width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); color: var(--ink); font: inherit; line-height: 1.5; }
.editor textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.editor textarea[readonly] { background: transparent; }
.editor .re { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
@media (max-width: 760px) { .drill { grid-template-columns: 1fr; } }

/* The register (list) */
.tools2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tools2 .search { flex: 1 1 240px; }
.tools2 label.chk { display: inline-flex; gap: 7px; align-items: center; font-size: .86rem; color: var(--muted); font-weight: 600; cursor: pointer; }
.tools2 label.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.reg { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; }
.sc { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 16px; padding: 16px; text-decoration: none; color: inherit; align-items: start; }
.sc:hover { border-color: var(--accent); }
.sc.retired { opacity: .72; }
.sc b.t { font-weight: 700; font-size: .98rem; line-height: 1.25; display: block; }
.sc .sent { color: var(--muted); font-size: .84rem; line-height: 1.5; margin-top: 6px; }
.sc .fws { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.sc svg { display: block; width: 112px; height: auto; }
.sc .gl { stroke: var(--accent); fill: color-mix(in srgb, var(--accent-soft) 50%, transparent); stroke-dasharray: 4 3; stroke-width: 1.4; }
@media (max-width: 480px) { .sc { grid-template-columns: 1fr; } .sc svg { width: 96px; } }

/* The drawer and the diff */
.scrim { position: fixed; inset: 0; background: rgba(10, 20, 26, .45); z-index: 80; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -20px 0 50px rgba(0, 0, 0, .25); z-index: 81; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; animation: slide .2s ease-out; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.drawer > header { padding: 18px 20px 12px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line-soft); }
.drawer h2 { font-size: 1.1rem; }
.drawer .xb { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); font-size: 1.2rem; flex: none; }
.drawer .xb:hover { background: var(--raised); } .drawer .xb:focus-visible { outline: 2px solid var(--accent); }
.drawer .dbody { overflow: auto; padding: 6px 20px 18px; display: grid; gap: 4px; align-content: start; }
.drawer footer { padding: 12px 20px 16px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.drawer footer .fine { margin-right: auto; max-width: 26ch; }
.dh { font-size: .72rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 0 6px; }
.mrow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line-soft); }
.mrow:first-of-type { border-top: 0; }
.mrow b { font-weight: 680; font-size: .9rem; } .mrow small { display: block; color: var(--muted); font-size: .76rem; }
.drawer .add { display: grid; gap: 6px; padding-top: 10px; }
.drawer .add select { width: 100%; }
.diff { display: grid; gap: 14px; }
.dblk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--line-soft); border-radius: 12px; overflow: clip; }
.dblk > h4 { grid-column: 1 / -1; margin: 0; padding: 7px 12px; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--raised); }
.dblk .col { padding: 8px 0; display: grid; align-content: start; font-size: .84rem; }
.dblk .col + .col { border-left: 1px solid var(--line-soft); }
.dblk .col > small { padding: 0 12px 4px; color: var(--faint); font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.dl { padding: 3px 12px 3px 28px; position: relative; line-height: 1.4; color: var(--muted); }
.dl.add { background: var(--ok-soft); color: var(--ok); font-weight: 650; }
.dl.add::before { content: "+"; position: absolute; left: 12px; font-weight: 800; }
.dl.warn { background: var(--gold-soft); color: var(--gold-ink); font-weight: 650; }
.dl.warn::before { content: "!"; position: absolute; left: 13px; font-weight: 800; }
.dl.del { background: var(--bad-soft); color: var(--bad); } .dl.del::before { content: "−"; position: absolute; left: 12px; font-weight: 800; }
.dl.none { color: var(--faint); font-style: italic; }

/* System page fragment */
.sys-pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .82rem; color: var(--muted); }
.sys-pick a { text-decoration: none; padding: 3px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 620; }
.sys-pick a[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.scope-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.scope-row:first-child { border-top: 0; }
.scope-row .src { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .84rem; color: var(--muted); } .facts b { color: var(--ink); font-weight: 650; }
.sline { padding: 12px 0; border-top: 1px solid var(--line-soft); display: grid; gap: 4px; font-size: .9rem; line-height: 1.55; }
.sline:first-child { border-top: 0; }
.sline a { color: var(--accent); font-weight: 680; text-decoration: none; } .sline a:hover { text-decoration: underline; }

/* Nothing may widen the page: every grid track can shrink, wide tables scroll inside their own wrapper, long words wrap */
.app, .paper, .doc { grid-template-columns: minmax(0, 1fr); }
.app { max-width: 100%; } .card, .paper, .doc { min-width: 0; max-width: 100%; }
.paper h1, .paper h2, .paper h3, .paper p, .meta span, .sline, .sc b.t, .sc .sent, .banner p { overflow-wrap: anywhere; }
.paper > * { min-width: 0; }

@media print {
  #appbar, .ab-proto, .pv, .noprint, .toast, .scrim, .drawer, .toc, .tools { display: none !important; }
  body { background: #fff; }
  .app { padding: 0; max-width: none; } .doc { width: 100%; }
  .card { box-shadow: none; border: 0; border-radius: 0; }
  .paper { padding: 0; }
  tr.dr { display: none; } tr.rq { break-inside: avoid; cursor: default; }
  .peri { break-inside: avoid; }
}
</style>
</head>
<body>
<header id="appbar"></header>
<main class="app" id="page"></main>
<script src="../shared/kit.js"></script>
<script src="data.js"></script>
<script src="../shared/appbar.js"></script>
<script>
(function () {
  const D = window.BND, Kit = window.Kit, { esc } = Kit, ST = D.STATUS;
  const $ = (s, r = document) => r.querySelector(s);
  const initials = (n) => n.split(' ').map((p) => p[0]).join('').slice(0, 2);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const fmt = (d) => new Date(d + 'T12:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const short = (b) => b.name.replace(/ \(.*/, '');
  const list = (a) => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  const J = JSON.parse(JSON.stringify(D.JUST)); // justifications live here while the page is open

  // Providers are Systems that other Systems inherit Controls from (ADR 0008). These are made up for the prototype;
  // `serves` is the member Systems that depend on each one.
  const PROV = [
    { id: 'azure', name: 'Azure landing zone', serves: ['m365', 'entra', 'unily'] },
    { id: 'atl', name: 'Atlassian Cloud platform', serves: ['jira'] },
    { id: 'dsy', name: '3DEXPERIENCE cloud', serves: ['catia'] },
    { id: 'ghe', name: 'GitHub Enterprise Cloud', serves: ['gh'] },
    { id: 'now', name: 'Now Platform', serves: ['snow'] },
  ];

  // ---- state, kept in the URL ----
  const P = new URLSearchParams(location.search);
  const VIEWS = ['list', 'boundary', 'statement', 'system'];
  const ui = {
    view: VIEWS.includes(P.get('view')) ? P.get('view') : 'list',
    b: D.bnd(P.get('b')) ? P.get('b') : 'uk',
    s: D.sys(P.get('s')) ? P.get('s') : 'jira',
    q: '', fw: 'all', retired: P.get('retired') === '1',
    drawer: P.get('drawer') === '1' ? { step: 'list', s: null } : null,
    sf: 'all', sq: '', open: new Set(),
  };
  const url = () => {
    const q = new URLSearchParams({ view: ui.view });
    if (ui.view === 'boundary' || ui.view === 'statement') q.set('b', ui.b);
    if (ui.view === 'system') q.set('s', ui.s);
    if (ui.retired) q.set('retired', '1');
    if (ui.drawer && ui.view === 'boundary') q.set('drawer', '1');
    return location.pathname + '?' + q + location.hash;
  };
  const go = (view, extra = {}) => { Object.assign(ui, { view, drawer: null }, extra); history.pushState(null, '', url()); render(); scrollTo(0, 0); };
  addEventListener('popstate', () => { const p = new URLSearchParams(location.search); ui.view = VIEWS.includes(p.get('view')) ? p.get('view') : 'list'; if (D.bnd(p.get('b'))) ui.b = p.get('b'); if (D.sys(p.get('s'))) ui.s = p.get('s'); ui.retired = p.get('retired') === '1'; ui.drawer = p.get('drawer') === '1' ? { step: 'list', s: null } : null; render(); });
  addEventListener('appbar:role', render);
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.drawer) { closeDrawer(); } });
  const link = (view, extra, text, cls = '') => {
    const q = new URLSearchParams({ view });
    if (extra.b) q.set('b', extra.b);
    if (extra.s) q.set('s', extra.s);
    return `<a class="${cls}" href="?${q}${location.hash}" data-go="${esc(JSON.stringify({ view, ...extra }))}">${text}</a>`;
  };

  // ---- who may do what: every role reads; a Compliance Manager or an Admin curates; the Boundary Owner manages members ----
  const who = () => Appbar.role();
  const isCM = () => ['COMPLIANCE_MANAGER', 'ADMIN'].includes(who().key);
  const canManage = (b) => !b.retired && (isCM() || who().person === b.owner);

  // ---- small pieces ----
  const chip = (tone, text) => `<span class="chip ${tone}">${esc(text)}</span>`;
  const stateChip = (s) => { const t = D.STATE[s.state]; return chip(t.tone, t.group === 'pending' ? 'Not yet operating' : t.label); };
  const fwChip = (f) => `<span class="fwchip ${f.base ? 'base' : ''}">${esc(f.short)}${f.base ? ' · base' : ''}</span>`;
  const person = (n) => `<span class="person"><span class="av">${esc(initials(n))}</span>${esc(n)}</span>`;
  const statusChip = (st) => chip(ST[st].tone, ST[st].label);
  const sysLink = (s) => link('system', { s: s.id }, esc(s.name));
  const pctColor = (v) => (v >= 75 ? 'var(--ok)' : v >= 50 ? 'var(--gold)' : 'var(--bad)');
  const proto = () => `<div class="pv noprint"><span>Prototype views</span><div class="seg" role="group" aria-label="Views">
    ${[['list', 'Register', {}], ['boundary', 'Scope statement', { b: ui.b }], ['statement', 'Statement only', { b: ui.b }], ['system', 'System page', { s: ui.s }]]
      .map(([v, l, e]) => link(v, e, l).replace('<a ', `<a ${ui.view === v ? 'aria-current="true" ' : ''}`)).join('')}</div>
    <span class="fine">Acting as <b>${esc(who().person)}</b> (${esc(who().label)}); switch the user in the header to see who may edit.</span></div>`;
  const crumbs = (...parts) => `<nav class="crumbs noprint" aria-label="Breadcrumb">${parts.join('<span>/</span>')}</nav>`;
  const pbn = (b) => b.fws.filter((f) => !D.FW[f].base).map((f) => D.FW[f].short);

  // ================= 1. the register: one card per scope statement =================
  function glyph(b) {
    const x = D.split(b), n = Math.min(x.counted.length, 8), p = Math.min(x.pending.length, 3);
    const dots = Array.from({ length: n }, (_, i) => `<rect x="${14 + (i % 4) * 22}" y="${14 + Math.floor(i / 4) * 18}" width="16" height="12" rx="3" fill="${b.retired ? 'var(--line)' : 'var(--accent)'}"/>`).join('');
    const edge = Array.from({ length: p }, (_, i) => `<rect x="${24 + i * 26}" y="55" width="16" height="12" rx="3" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="3 2"/>`).join('');
    return `<svg viewBox="0 0 112 80" aria-hidden="true"><rect class="gl" x="4" y="6" width="104" height="56" rx="10" ${b.retired ? 'style="stroke:var(--faint);fill:none"' : ''}/>${dots}${edge}</svg>`;
  }
  function sentence(b) {
    const x = D.split(b), fw = list(D.fwOf(b).map((f) => f.short));
    if (b.retired) return `Retired ${fmt(b.retired.on)}. Kept as a record: ${b.fws.length === 1 ? 'one Framework' : plural(b.fws.length, 'Framework')}, ${plural(b.members.length, 'System')}.`;
    return `${esc(b.bu || 'The whole organization')} holds ${plural(x.counted.length, 'counted System')} to ${esc(fw)}${x.pending.length ? `, with ${x.pending.length} not yet operating on the edge` : ''}.`;
  }
  function listView() {
    const all = D.BOUNDARIES;
    let shown = all.filter((b) => ui.retired || !b.retired);
    if (ui.fw !== 'all') shown = shown.filter((b) => b.fws.includes(ui.fw));
    if (ui.q) shown = shown.filter((b) => (b.name + ' ' + b.desc + ' ' + b.owner).toLowerCase().includes(ui.q.toLowerCase()));
    const nRet = all.filter((b) => b.retired).length;
    return `${proto()}
    <section class="card" style="padding:24px 26px;display:grid;gap:10px">
      <div class="eyebrow">Compliance</div><h1>Scope statements</h1>
      <p style="color:var(--muted);max-width:70ch">Every Compliance Boundary is a scope statement an auditor can read: who owns it, which Frameworks it is held to and which Systems are in. Open one to read it as a document, with its perimeter and its Statement of Applicability.</p>
      <div class="acts"><button class="btn primary" id="newB" ${isCM() ? '' : 'disabled title="A Compliance Manager or an Admin creates a Boundary"'}>New Boundary</button>${isCM() ? '' : '<span class="fine" style="align-self:center">A Compliance Manager or an Admin creates Boundaries.</span>'}</div></section>
    <div class="tools2"><label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 4a5 5 0 1 0 0 10A5 5 0 0 0 9 4zM13 13l4 4"/></svg><input id="q" type="search" placeholder="Search Boundaries, owners, contracts" value="${esc(ui.q)}" aria-label="Search Boundaries"></label>
      <div class="fseg" role="group" aria-label="Framework">${[['all', 'All Frameworks']].concat(Object.values(D.FW).map((f) => [f.id, f.short])).map(([id, l]) => `<button data-fw="${id}" aria-pressed="${ui.fw === id}">${esc(l)}</button>`).join('')}</div>
      <label class="chk"><input type="checkbox" id="showRet" ${ui.retired ? 'checked' : ''}> Show retired (${nRet})</label></div>
    ${shown.length ? `<div class="reg">${shown.map((b) => `<a class="card sc spot ${b.retired ? 'retired' : ''}" href="?view=boundary&b=${b.id}${location.hash}" data-go='${esc(JSON.stringify({ view: 'boundary', b: b.id }))}'>${glyph(b)}
        <div><b class="t">${esc(b.name)} ${b.retired ? chip('', 'Retired') : ''}</b><div class="sent">${sentence(b)}</div><div class="fws">${D.fwOf(b).map(fwChip).join('')}</div>
        <div class="fine" style="margin-top:8px">Boundary Owner ${esc(b.owner)}${b.bu ? ' · ' + esc(b.bu) : ''}</div></div></a>`).join('')}</div>`
      : `<section class="card"><div class="done-state">${Kit.CHECK}<h3>No Boundaries match</h3><p>Clear a filter, or show retired Boundaries.</p></div></section>`}`;
  }
  function listBind() {
    $('#newB') && $('#newB').addEventListener('click', () => Kit.toast('Prototype: a form with name, description, Frameworks, Business Unit and Boundary Owner'));
    document.querySelectorAll('[data-fw]').forEach((b) => b.addEventListener('click', () => { ui.fw = b.dataset.fw; render(); }));
    $('#q').addEventListener('input', (e) => { ui.q = e.target.value; render(); const i = $('#q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); });
    $('#showRet').addEventListener('change', (e) => { ui.retired = e.target.checked; history.replaceState(null, '', url()); render(); });
  }

  // ================= 2. the scope statement document =================
  // Where each System stands: inside (counted), on the edge (not yet operating), closed, or outside (a candidate or not a member).
  function positions(b) {
    const x = D.split(b), cands = D.candidates(b);
    const why = (s) => {
      const t = D.STATE[s.state].label;
      return { counted: `${t}: counts toward the statement and the percentages.`, pending: `${t}: planned in, shown on the edge, not counted until it is Onboarded or has an ATO.`, closed: `${t}: stays listed because it was added earlier, but is not counted and can’t be added again.` };
    };
    const rows = [];
    x.counted.forEach((s) => rows.push({ s, pos: 'in', label: 'Inside', why: why(s).counted }));
    x.pending.forEach((s) => rows.push({ s, pos: 'edge', label: 'On the edge', why: why(s).pending }));
    x.closed.forEach((s) => rows.push({ s, pos: 'closed', label: 'Closed', why: why(s).closed }));
    if (!b.retired) {
      cands.forEach((s) => rows.push({ s, pos: 'cand', label: 'Outside · candidate', why: `Prepared for ${list(b.fws.filter((f) => !D.FW[f].base && s.declared.includes(f)).map((f) => D.FW[f].short))} but not a member. Its Controls already apply and are assessed.` }));
      D.addable(b).forEach((s) => rows.push({ s, pos: 'out', label: 'Outside', why: 'Not a member, and not prepared for a Framework of this Boundary.' }));
      D.SYSTEMS.filter((s) => !b.members.includes(s.id) && D.group(s) === 'closed').forEach((s) => rows.push({ s, pos: 'out', label: 'Outside', why: `${D.STATE[s.state].label}: a closed System can’t be added.` }));
    }
    return rows;
  }
  function prose(b) {
    const x = D.split(b), cands = D.candidates(b), fws = D.fwOf(b);
    const names = (a) => list(a.map(sysLink));
    const out = [];
    out.push(`<b>${esc(b.name)}</b> is a Compliance Boundary of ${b.bu ? `the <b>${esc(b.bu)}</b> Business Unit` : 'the <b>whole organization</b>'}, owned by <b>${esc(b.owner)}</b>. It is held to ${list(fws.map((f) => `<b>${esc(f.name)}</b>${f.base ? ' (the base Framework)' : ''}`))}. ${esc(b.desc)}`);
    out.push(x.counted.length ? `In scope today: ${names(x.counted)}. ${x.counted.length === 1 ? 'It is' : 'These ' + x.counted.length + ' Systems are'} Onboarded or ${x.counted.length === 1 ? 'has' : 'have'} an ATO, so ${x.counted.length === 1 ? 'it counts' : 'they count'} toward the statement and the Compliance Percentage.` : 'No System counts yet, so every Requirement below is excluded.');
    if (x.pending.length) out.push(`On the edge: ${names(x.pending)} ${x.pending.length === 1 ? 'is' : 'are'} in evaluation. ${x.pending.length === 1 ? 'It is' : 'They are'} planned into the perimeter and shown here, but not counted until Onboarded or an ATO.`);
    if (x.closed.length) out.push(`Closed: ${names(x.closed)} ${x.closed.length === 1 ? 'was' : 'were'} added earlier and ${x.closed.length === 1 ? 'is' : 'are'} listed, not counted.`);
    if (cands.length) out.push(`Outside, but prepared for ${list(pbn(b))}: ${names(cands)}. ${cands.length === 1 ? 'It is' : 'They are'} candidates, not gaps.`);
    return out.map((t) => `<p class="prose">${t}</p>`).join('');
  }
  const pctTable = (b) => `<div class="tw"><table class="dt"><thead><tr><th>Framework</th><th>Compliance Percentage</th><th>Basis</th></tr></thead><tbody>${D.fwOf(b).map((f) => {
    const p = D.pct(b, f.id);
    const ring = p.value === null ? '<span class="dash" style="width:38px;height:38px;font-size:.95rem" aria-label="No percentage">—</span>' : Kit.ring([[p.value / 100, pctColor(p.value)]], 38, 5, p.value + '%', '');
    return `<tr><td class="k">${esc(f.name)}</td><td><div class="pcrow">${ring}<b>${p.value === null ? '—' : p.value + '%'}</b></div></td>
      <td>${p.value === null ? 'Nothing applicable yet.' : `${p.met} of ${p.app} applicable ${esc(f.unit)} met`}<small>Pooled over ${plural(p.systems, 'counted System')}</small></td></tr>`; }).join('')}</tbody></table></div>`;
  const whyTable = (b) => `<div class="tw"><table class="dt"><thead><tr><th>System</th><th>Position</th><th>Why</th></tr></thead><tbody>${positions(b).map((r) => `<tr><td class="k">${sysLink(r.s)}<small>${esc(r.s.bu)}</small></td>
    <td><span class="pos ${r.pos}"><i></i>${esc(r.label)}</span></td><td>${esc(r.why)}</td></tr>`).join('')}</tbody></table></div>`;

  // The perimeter: counted Systems inside the dashed box, not-yet-operating ones astride its edge, Providers outside on the left
  // with an arrow to each System that inherits from them, closed Systems and candidates outside on the right.
  function perimeter(b) {
    const x = D.split(b), cands = D.candidates(b), W = 800, NH = 40, GAP = 14;
    const bx = 214, bw = 380, top = 52, nx = bx + 40, nw = bw - 80;
    const inside = x.counted, rowsH = Math.max(inside.length, 1) * (NH + GAP);
    const bBottom = top + 34 + rowsH + 10;
    const pos = {};
    inside.forEach((s, i) => { pos[s.id] = { y: top + 34 + i * (NH + GAP), x: nx, w: nw, kind: 'in', s }; });
    x.pending.forEach((s, i) => { pos[s.id] = { y: bBottom - NH / 2, x: nx + (i % 1) * 0, w: nw, kind: 'edge', s, dy: i * (NH + 10) }; });
    x.pending.forEach((s, i) => { pos[s.id].y = bBottom - NH / 2 + i * (NH + 10); });
    const edgeExtra = x.pending.length ? (x.pending.length - 1) * (NH + 10) + NH / 2 + 10 : 0;
    // providers: placed at the average height of what they serve, pushed apart
    const prov = PROV.map((p) => ({ ...p, hit: p.serves.filter((id) => pos[id]) })).filter((p) => p.hit.length)
      .map((p) => ({ ...p, y: p.hit.reduce((a, id) => a + pos[id].y, 0) / p.hit.length })).sort((a, c) => a.y - c.y);
    prov.forEach((p, i) => { if (i && p.y < prov[i - 1].y + NH + 12) p.y = prov[i - 1].y + NH + 12; });
    const right = x.closed.map((s) => ({ s, kind: 'closed' })).concat(cands.map((s) => ({ s, kind: 'cand' })));
    right.forEach((r, i) => { r.y = top + 34 + i * (NH + 12); });
    const H = Math.max(bBottom + 24 + edgeExtra, (prov.length ? prov[prov.length - 1].y + NH : 0) + 24, (right.length ? right[right.length - 1].y + NH : 0) + 24, 150);
    const short14 = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
    const arrows = prov.map((p) => p.hit.map((id) => { const t = pos[id], y1 = p.y + NH / 2, y2 = t.y + NH / 2;
      return `<path class="arr" d="M162 ${y1} C ${bx - 10} ${y1}, ${bx - 10} ${y2}, ${t.x - 2} ${y2}" marker-end="url(#ah)"/>`; }).join('')).join('');
    return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Perimeter of ${esc(b.name)}: ${x.counted.length} counted Systems inside, ${x.pending.length} not yet operating on the edge, ${prov.length} Providers outside">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1l8 4-8 4z" fill="var(--faint)"/></marker></defs>
      <text class="lbl" x="8" y="26">Providers (outside)</text><text class="lbl" x="${bx}" y="26">Perimeter</text><text class="lbl" x="${W - 8}" y="26" text-anchor="end">Outside</text>
      <rect class="box" x="${bx}" y="${top - 12}" width="${bw}" height="${bBottom - top + 12}" rx="16"/>
      <text class="sb" x="${bx + 16}" y="${top + 14}">${esc(short(b))}</text>
      ${arrows}
      ${prov.map((p) => `<g><rect class="n-prov" x="8" y="${p.y}" width="154" height="${NH}" rx="10"/><text class="nm" x="20" y="${p.y + 17}">${esc(short14(p.name, 21))}</text><text class="sb" x="20" y="${p.y + 31}">Provider · ${p.hit.length} dependent${p.hit.length === 1 ? '' : 's'}</text><title>${esc(p.name)}</title></g>`).join('')}
      ${inside.map((s) => { const t = pos[s.id]; return `<g><rect class="n-in" x="${t.x}" y="${t.y}" width="${t.w}" height="${NH}" rx="10"/><text class="nm" x="${t.x + 14}" y="${t.y + 17}">${esc(s.name)}</text><text class="sb" x="${t.x + 14}" y="${t.y + 31}">${esc(D.STATE[s.state].label)} · ${esc(s.bu)}</text></g>`; }).join('')}
      ${x.pending.map((s) => { const t = pos[s.id]; return `<g><rect class="n-edge" x="${t.x}" y="${t.y}" width="${t.w}" height="${NH}" rx="10"/><text class="nm" x="${t.x + 14}" y="${t.y + 17}">${esc(s.name)}</text><text class="sb" x="${t.x + 14}" y="${t.y + 31}">Not yet operating · ${esc(D.STATE[s.state].label)}</text></g>`; }).join('')}
      ${right.map((r) => `<g><rect class="${r.kind === 'closed' ? 'n-ghost' : 'n-cand'}" x="${W - 168}" y="${r.y}" width="160" height="${NH}" rx="10"/><text class="nm ${r.kind === 'closed' ? 'strike' : ''}" x="${W - 156}" y="${r.y + 17}" style="${r.kind === 'closed' ? 'fill:var(--faint)' : ''}">${esc(r.s.name)}</text><text class="sb" x="${W - 156}" y="${r.y + 31}">${r.kind === 'closed' ? 'Closed · ' + esc(D.STATE[r.s.state].label) : 'Candidate · prepared'}</text></g>`).join('')}
    </svg>`,
      list: `<div class="peri-list"><div><b>Inside the perimeter (counted)</b><ul>${inside.map((s) => `<li>${esc(s.name)}${PROV.filter((p) => p.serves.includes(s.id)).map((p) => ` ← inherits from ${esc(p.name)}`).join('')}</li>`).join('') || '<li>None yet</li>'}</ul></div>
        ${x.pending.length ? `<div><b>On the edge (not yet operating)</b><ul>${x.pending.map((s) => `<li>${esc(s.name)}${PROV.filter((p) => p.serves.includes(s.id)).map((p) => ` ← inherits from ${esc(p.name)}`).join('')}</li>`).join('')}</ul></div>` : ''}
        ${right.length ? `<div><b>Outside</b><ul>${right.map((r) => `<li>${esc(r.s.name)} · ${r.kind === 'closed' ? 'closed' : 'candidate'}</li>`).join('')}</ul></div>` : ''}</div>` };
  }

  // ---- the statement sections, inline ----
  const sdata = (b) => b.fws.map((f) => ({ fw: D.FW[f], rows: D.rows(b, f), pct: D.pct(b, f) }));
  const needsJ = (b, r) => !r.included && !(J[b.id] && J[b.id][r.code]);
  function passes(b, r) {
    if (ui.sf === 'included' && !r.included) return false;
    if (ui.sf === 'excluded' && r.included) return false;
    if (ui.sf === 'notmet' && r.st !== 'N') return false;
    if (ui.sf === 'missing' && !needsJ(b, r)) return false;
    return !ui.sq || (r.code + ' ' + r.title).toLowerCase().includes(ui.sq.toLowerCase());
  }
  function statusCell(r) {
    if (!r.included) return '<span class="fine">Not in the statement</span>';
    const bar = r.app.length ? `<div class="bar" role="img" aria-label="${r.met} met of ${r.of}">${['M', 'P', 'N'].map((k) => { const n = r.app.filter((p) => p.st === k).length; return n ? `<i style="flex:${n};background:${ST[k].color}"></i>` : ''; }).join('')}</div>` : '';
    return `${statusChip(r.st)}<small>${r.app.length ? (r.orgOnly ? `Organization · met on ${r.met} of ${r.of}` : `Met on ${r.met} of ${plural(r.of, 'System')}`) : 'Organization only'}</small>${bar}`;
  }
  function drill(b, r, fw) {
    const manage = canManage(b), pend = D.split(b).pending;
    const sy = r.per.map((p) => `<div class="${p.st === 'A' ? 'off' : ''}"><span>${esc(p.sys.name)}</span>${p.st === 'A' ? '<span class="fine">Not applicable</span>' : statusChip(p.st)}</div>`).join('');
    const jv = (J[b.id] && J[b.id][r.code]) || '';
    const left = `<div><h4>${r.included ? 'Status per counted System' : 'Counted Systems'}</h4><div class="syl">${sy || '<p>No counted System yet.</p>'}${r.org ? `<div><span>Organization (Organizational Controls)</span>${statusChip(r.org)}</div>` : ''}</div>
      ${pend.length ? `<p class="fine" style="margin-top:8px">${esc(pend.map((s) => s.name).join(', '))} not yet operating, so not counted.</p>` : ''}
      <p class="fine" style="margin-top:8px">One Assessment per System and Control, read by every Boundary the System is in. A Boundary never changes it.</p></div>`;
    const right = r.included
      ? `<div><h4>Justification</h4><p>Included, because it applies to ${r.app.length && !r.orgOnly ? plural(r.of, 'counted System') : 'the Organization’s Controls'}. Inclusion is derived from applicability and can’t be overridden, so there is nothing to justify.</p></div>`
      : `<div class="editor"><h4>Why this ${esc(fw.one.toLowerCase())} is excluded</h4><p>Derived: no counted System of this Boundary has it apply and no Organizational Control covers it. A justification explains the exclusion; it never changes a status.</p>
          <textarea class="j-ta" data-key="${esc(r.code)}" aria-label="Exclusion justification for ${esc(r.code)}" ${manage ? '' : 'readonly'} placeholder="${manage ? 'Say why this does not apply to this Boundary' : 'No justification written yet'}">${esc(jv)}</textarea>
          <div class="re"><span>${manage ? 'Stored for this Boundary and this Requirement only.' : `Written by the Boundary Owner (${esc(b.owner)}) or a Compliance Manager.`}</span>${manage ? '<button class="btn primary sm" data-save-j>Save justification</button>' : ''}</div></div>`;
    return `<tr class="dr"><td colspan="5"><div class="drill">${left}${right}</div></td></tr>`;
  }
  function section(b, d, no) {
    const rs = d.rows.filter((r) => passes(b, r)), inc = d.rows.filter((r) => r.included).length;
    const rowHtml = (r) => {
      const open = ui.open.has(r.key), jv = J[b.id] && J[b.id][r.code];
      const jt = r.included ? '<span class="fine">Not needed: it applies</span>' : jv ? `<span class="jt">${esc(jv)}</span>` : '<span class="missing">Missing justification</span>';
      return `<tr class="rq ${r.included ? '' : 'ex'} ${open ? 'open' : ''}" data-open="${esc(r.key)}" tabindex="0" aria-expanded="${open}"><td class="code">${esc(r.code)}</td><td class="tt">${esc(r.title)}</td>
        <td><span class="inc ${r.included ? 'yes' : 'no'}">${r.included ? 'Included' : 'Excluded'}</span></td><td>${statusCell(r)}</td><td>${jt}</td></tr>${open ? drill(b, r, d.fw) : ''}`;
    };
    return `<div id="sec-${d.fw.id}" class="sect" data-fw="${d.fw.id}"><h3 class="sh"><span><span class="no">${no}</span>${esc(d.fw.name)}${d.fw.base ? ' · base Framework' : ''}</span>
        <span class="acts noprint"><button class="btn sm" data-csv="${d.fw.id}">Export section (CSV)</button><button class="btn sm" data-print="${d.fw.id}">Print section</button></span></h3>
      <p class="prose" style="margin:6px 0 10px">${d.rows.length} ${esc(d.fw.unit)}: <b>${inc}</b> included, <b>${d.rows.length - inc}</b> excluded. Compliance Percentage <b>${d.pct.value === null ? '—' : d.pct.value + '%'}</b>.</p>
      <div class="tw"><table class="dt"><thead><tr><th>${esc(d.fw.one)}</th><th>Title</th><th>In the statement</th><th>Worst status</th><th>Justification</th></tr></thead>
        <tbody>${rs.length ? rs.map(rowHtml).join('') : `<tr><td colspan="5">No ${esc(d.fw.unit)} match the filter.</td></tr>`}</tbody></table></div></div>`;
  }
  function statementPart(b, startNo, tag) {
    const ds = sdata(b), x = D.split(b), all = ds.flatMap((d) => d.rows);
    const n = { inc: all.filter((r) => r.included).length, exc: all.filter((r) => !r.included).length, nm: all.filter((r) => r.st === 'N').length, mj: all.filter((r) => needsJ(b, r)).length };
    const seg = [['all', 'All ' + all.length], ['included', 'Included ' + n.inc], ['excluded', 'Excluded ' + n.exc], ['notmet', 'Not met ' + n.nm], ['missing', 'Missing justification ' + n.mj]];
    return `<h2 class="sh" id="statement"><span class="no">${startNo}</span>Statement of Applicability</h2>
      <p class="prose">One section per Framework, with that Framework’s own Requirements as rows. A Requirement is <b>included</b> when it applies to at least one counted System or the Organization implements it; its status is the <b>worst</b> across the counted Systems, shown as “Met on x of y”. A justification only explains an exclusion and never changes a status.</p>
      ${x.counted.length ? '' : `<div class="banner warn" role="note"><div><b>No counted System yet</b><p>Every Requirement is excluded until a System is Onboarded or has an ATO.</p></div></div>`}
      <div class="tools noprint"><label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 4a5 5 0 1 0 0 10A5 5 0 0 0 9 4zM13 13l4 4"/></svg><input id="sq" type="search" placeholder="Search by code or title" value="${esc(ui.sq)}" aria-label="Search Requirements"></label>
        <div class="fseg" role="group" aria-label="Filter">${seg.map(([k, l]) => `<button data-sf="${k}" aria-pressed="${ui.sf === k}">${esc(l)}</button>`).join('')}</div></div>
      <p class="fine noprint">${canManage(b) ? `You can write exclusion justifications here (${esc(who().person)}).` : `Read only for ${esc(who().label)}: the Boundary Owner, a Compliance Manager or an Admin writes justifications.`} Click a row for its drill-down.</p>
      ${ds.map((d, i) => section(b, d, `${startNo}.${i + 1}`)).join('')}`;
  }
  const retiredCard = (b) => `<div class="banner retired" role="note"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="4" y="9" width="12" height="8" rx="2"/><path d="M7 9V6a3 3 0 0 1 6 0v3"/></svg>
    <div><b>Retired ${esc(fmt(b.retired.on))} by ${esc(b.retired.by)}</b><p>${esc(b.retired.why)} Retiring is final: this Boundary brings no Framework into a System’s scope any more and is kept as a read-only record. There is no statement or percentage, and no frozen copy of one: the export is the evidence an auditor keeps.</p></div></div>`;
  const metaBlock = (b) => `<div class="meta"><div><small>Boundary Owner</small><span>${person(b.owner)}</span></div><div><small>Business Unit</small><span>${b.bu ? esc(b.bu) : 'None (whole organization)'}</span></div>
    <div><small>Held to</small><span>${D.fwOf(b).map(fwChip).join(' ')}</span></div><div><small>Created</small><span>${esc(fmt(b.created))}${b.retired ? ' · retired ' + esc(fmt(b.retired.on)) : ''}</span></div></div>`;

  function boundaryView() {
    const b = D.bnd(ui.b), manage = canManage(b), x = D.split(b);
    const per = perimeter(b);
    return `${proto()}${crumbs(link('list', {}, 'Compliance Boundaries'), esc(short(b)))}
    <div class="doc"><article class="card paper">
      <div class="eyebrow">Scope statement ${b.retired ? chip('', 'Retired') : chip('success', 'Active')}<span class="fine">Boundary Owner ${esc(b.owner)}</span></div>
      <h1>${esc(b.name)}</h1>
      ${metaBlock(b)}
      <div class="acts noprint">${b.retired ? '' : `<button class="btn primary" id="editM" ${manage ? '' : 'disabled title="Only the Boundary Owner, a Compliance Manager or an Admin edits membership"'}>Edit membership</button>
        <button class="btn" data-csv="all">Export statement (CSV)</button><button class="btn" data-print="all">Print</button>
        <button class="btn" id="edit" ${isCM() ? '' : 'disabled title="A Compliance Manager or an Admin edits Frameworks and the owner"'}>Edit Frameworks and owner</button>
        <button class="btn" id="retire" ${manage ? '' : 'disabled title="The Boundary Owner, a Compliance Manager or an Admin retires a Boundary"'}>Retire</button>`}
        ${b.retired ? `<span class="fine">A retired Boundary is read-only.</span>` : !manage ? `<span class="fine">Read only for ${esc(who().label)}: the Boundary Owner (${esc(b.owner)}), a Compliance Manager or an Admin edits membership.</span>` : ''}</div>
      ${b.retired ? retiredCard(b) : `<nav class="toc noprint" aria-label="On this page"><span>On this page</span><a href="#scope">1 Scope</a><a href="#perimeter">2 Perimeter</a><a href="#statement">3 Statement of Applicability</a></nav>`}
      <h2 class="sh" id="scope"><span class="no">1</span>Scope</h2>
      ${prose(b)}
      <h3 class="sh" style="margin-top:6px">Systems in and out, and why</h3>${whyTable(b)}
      ${b.retired ? '' : `<h3 class="sh" style="margin-top:6px">Compliance Percentage</h3>${pctTable(b)}
      <h2 class="sh" id="perimeter"><span class="no">2</span>Perimeter</h2>
      <p class="prose">Counted Systems sit inside. A System that is not yet operating sits on the edge. Providers sit outside, with an arrow to each System that inherits Controls from them.</p>
      <div class="peri">${per.svg}<div class="pkey"><span><svg width="26" height="14"><rect x="1" y="1" width="24" height="12" rx="4" class="n-in" style="fill:var(--surface);stroke:var(--accent);stroke-width:1.5"/></svg>Counted</span><span><svg width="26" height="14"><rect x="1" y="1" width="24" height="12" rx="4" style="fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 2"/></svg>Not yet operating</span><span><svg width="26" height="14"><rect x="1" y="1" width="24" height="12" rx="4" style="fill:none;stroke:var(--line);stroke-width:1.5"/></svg>Provider</span><span><svg width="26" height="14"><path d="M1 7h20" style="stroke:var(--faint);stroke-width:1.5"/><path d="M19 3l5 4-5 4z" style="fill:var(--faint)"/></svg>Inherits Controls</span><span><svg width="26" height="14"><rect x="1" y="1" width="24" height="12" rx="4" style="fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:2 3"/></svg>Candidate</span></div></div>${per.list}
      ${statementPart(b, 3)}`}
    </article></div>${drawer(b)}`;
  }
  function statementOnly() {
    const b = D.bnd(ui.b);
    if (b.retired) return `${proto()}${crumbs(link('list', {}, 'Compliance Boundaries'), link('boundary', { b: b.id }, esc(short(b))), 'Statement of Applicability')}
      <div class="doc"><article class="card paper">${retiredCard(b)}<div class="acts">${link('boundary', { b: b.id }, 'Back to the scope statement', 'btn')}</div></article></div>`;
    const x = D.split(b);
    return `${proto()}${crumbs(link('list', {}, 'Compliance Boundaries'), link('boundary', { b: b.id }, esc(short(b))), 'Statement of Applicability')}
    <div class="doc"><article class="card paper">
      <div class="eyebrow">Statement of Applicability</div><h1>${esc(b.name)}</h1>
      <p class="prose">Boundary Owner <b>${esc(b.owner)}</b>. ${plural(x.counted.length, 'counted System')}: ${esc(x.counted.map((s) => s.name).join(', ') || 'none yet')}.${x.pending.length ? ` Not yet operating, not counted: ${esc(x.pending.map((s) => s.name).join(', '))}.` : ''} Held to ${esc(list(D.fwOf(b).map((f) => f.name)))}. Exported ${esc(fmt('2026-11-23'))}.</p>
      <div class="acts noprint"><button class="btn primary" data-csv="all">Export whole statement (CSV)</button><button class="btn" data-print="all">Print whole statement</button>${link('boundary', { b: b.id }, 'Read the scope statement', 'btn ghost')}
        ${D.fwOf(b).map((f) => `<a class="btn ghost" href="#sec-${f.id}">Jump to ${esc(f.short)}</a>`).join('')}</div>
      ${statementPart(b, 1)}
    </article></div>`;
  }
  function csv(b, only) {
    const out = [['Boundary', 'Framework', 'Code', 'Title', 'In the statement', 'Worst status', 'Met on', 'Systems', 'Exclusion justification']];
    sdata(b).filter((d) => only === 'all' || d.fw.id === only).forEach((d) => d.rows.forEach((r) => out.push([b.name, d.fw.name, r.code, r.title, r.included ? 'Included' : 'Excluded',
      r.st ? ST[r.st].label : '', r.included ? `${r.met} of ${r.of}` : '', r.app.map((p) => `${p.sys.name}: ${ST[p.st].label}`).join('; '), (J[b.id] && J[b.id][r.code]) || ''])));
    return '﻿' + out.map((l) => l.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  }
  function docBind() {
    const b = D.bnd(ui.b);
    $('#edit') && $('#edit').addEventListener('click', () => Kit.toast('Prototype: edit Frameworks (adding or dropping one recomputes applicability) and the Boundary Owner'));
    $('#retire') && $('#retire').addEventListener('click', () => Kit.toast('Prototype: asks for a required comment and warns that retiring is final'));
    $('#editM') && $('#editM').addEventListener('click', () => { ui.drawer = { step: 'list', s: null }; history.replaceState(null, '', url()); render(); const d = $('.drawer .xb'); d && d.focus(); });
    if (b.retired) return;
    document.querySelectorAll('[data-sf]').forEach((c) => c.addEventListener('click', () => { ui.sf = ui.sf === c.dataset.sf ? 'all' : c.dataset.sf; const y = scrollY; render(); scrollTo(0, y); }));
    const q = $('#sq'); q && q.addEventListener('input', (e) => { ui.sq = e.target.value; const y = scrollY; render(); scrollTo(0, y); const i = $('#sq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); });
    document.querySelectorAll('tr[data-open]').forEach((c) => { const t = () => { const k = c.dataset.open; ui.open.has(k) ? ui.open.delete(k) : ui.open.add(k); const y = scrollY; render(); scrollTo(0, y); };
      c.addEventListener('click', t); c.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t(); } }); });
    document.querySelectorAll('tr.dr').forEach((d) => d.addEventListener('click', (e) => e.stopPropagation()));
    document.querySelectorAll('[data-csv]').forEach((c) => c.addEventListener('click', () => {
      const a = document.createElement('a'), only = c.dataset.csv;
      a.href = URL.createObjectURL(new Blob([csv(b, only)], { type: 'text/csv;charset=utf-8' }));
      a.download = `statement-${b.id}${only === 'all' ? '' : '-' + only}.csv`; a.click(); URL.revokeObjectURL(a.href);
      Kit.toast(only === 'all' ? 'Whole statement exported' : `${D.FW[only].short} section exported`);
    }));
    document.querySelectorAll('[data-print]').forEach((c) => c.addEventListener('click', () => {
      const only = c.dataset.print, st = document.createElement('style');
      st.textContent = only === 'all' ? '' : `@media print { .sect:not([data-fw="${only}"]), .paper > :not(.sect):not(#statement):not(.prose) { display: none !important; } }`;
      document.head.appendChild(st); addEventListener('afterprint', () => st.remove(), { once: true }); print();
    }));
    document.querySelectorAll('[data-save-j]').forEach((save) => save.addEventListener('click', () => {
      const ta = save.closest('.editor').querySelector('.j-ta'), code = ta.dataset.key; (J[b.id] = J[b.id] || {})[code] = ta.value.trim();
      if (!J[b.id][code]) delete J[b.id][code];
      Kit.toast(`Justification saved for ${code} on ${b.name}`); const y = scrollY; render(); scrollTo(0, y);
    }));
  }

  // ================= the side drawer: membership, and the join preview as a before/after diff =================
  function closeDrawer() { ui.drawer = null; history.replaceState(null, '', url()); render(); }
  function diffOf(b, s) {
    const p = D.preview(b, s), x = D.split(b), g = D.group(s);
    const before = D.scope(s).map((r) => r.fw.short), after = before.concat(p.fresh.map((f) => D.FW[f].short));
    const col = (lines, side) => `<div class="col"><small>${side}</small>${lines.join('') || '<div class="dl none">none</div>'}</div>`;
    const ln = (t, cls = '') => `<div class="dl ${cls}">${esc(t)}</div>`;
    const blk = (title, l, r) => `<div class="dblk"><h4>${esc(title)}</h4>${col(l, 'Scope today')}${col(r, 'Scope after')}</div>`;
    const cnt = x.counted.map((t) => ln(t.name)), pen = x.pending.map((t) => ln(t.name));
    const blocks = [
      blk(`Inside ${short(b)} (counted)`, cnt, cnt.concat(g === 'counted' ? [ln(s.name, 'add')] : [])),
      blk('On the edge (not yet operating)', pen, pen.concat(g === 'pending' ? [ln(s.name, 'add')] : [])),
      blk(`${s.name}: Frameworks in scope`, before.map((t) => ln(t)), after.map((t, i) => ln(t, i >= before.length ? 'add' : ''))),
      blk('Controls', [ln('Nothing changes', 'none')], p.controls ? [ln(`${p.controls} Controls newly apply`, 'add'), ln(`${p.fulfilled} already effectively Fulfilled (inheritance)`), ln(`${p.controls - p.fulfilled} start as work for ${s.owner}`)] : [ln('Nothing new applies', 'none')]),
      blk('Change Review', [ln('None', 'none')], [p.review ? ln('A Change Review starts: the System is Onboarded', 'warn') : ln(p.onboarded ? 'None: no new Controls' : 'None: not Onboarded', 'none')]),
    ];
    return { html: `<div class="diff">${blocks.join('')}</div>`, p };
  }
  function drawer(b) {
    const d = ui.drawer;
    if (!d || b.retired) return '';
    const x = D.split(b), cands = D.candidates(b), opts = D.addable(b);
    const mrow = (s, right) => `<div class="mrow"><div><b>${esc(s.name)}</b><small>${esc(s.bu)} · ${stateChip(s)}</small></div>${right}</div>`;
    let body, foot;
    if (d.step === 'diff' && d.s) {
      const s = D.sys(d.s), { html } = diffOf(b, s);
      body = `<div class="dh">Scope change if ${esc(s.name)} joins</div><p class="fine" style="margin-bottom:8px">Read-only preview, worked out with the same applicability rules as the real join. Nothing changes until you confirm.</p>${html}`;
      foot = `<span class="fine">Joining is recorded as a Change Event on the System.</span><button class="btn" id="dBack">Back</button><button class="btn primary" id="dAdd" data-s="${s.id}">Add ${esc(s.name)}</button>`;
    } else {
      body = `<div class="dh">In the Boundary · ${b.members.length}</div>
        ${[...x.counted, ...x.pending, ...x.closed].map((s) => mrow(s, `<button class="btn sm" data-remove="${s.id}">Remove</button>`)).join('') || '<p class="fine">No Systems yet.</p>'}
        <div class="dh">Candidates · prepared for ${esc(list(pbn(b)) || 'a Framework of this Boundary')}</div>
        ${cands.map((s) => mrow(s, `<button class="btn sm primary" data-prev="${s.id}">Review scope change</button>`)).join('') || `<p class="fine">${b.fws.every((f) => D.FW[f].base) ? 'ISO 27001 is the base Framework, so every System already applies it and none is only “prepared” for it.' : 'Every System prepared for these Frameworks is already in the Boundary.'}</p>`}
        <div class="dh">Add another System</div>
        <div class="add"><select class="sel" id="addSel" aria-label="Add a System"><option value="">Choose a System…</option>${opts.map((s) => `<option value="${s.id}">${esc(s.name)} · ${esc(D.STATE[s.state].label)}</option>`).join('')}</select>
          <span class="fine">A System in evaluation can join and shows on the edge. Closed Systems (Rejected, Not selected) can’t be added.</span></div>`;
      foot = `<span class="fine">Only the Boundary Owner, a Compliance Manager or an Admin changes membership.</span><button class="btn primary" id="dDone">Done</button>`;
    }
    return `<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dT"><header><div><div class="eyebrow">Edit membership</div><h2 id="dT">${esc(short(b))}</h2></div><button class="xb" id="dX" aria-label="Close">×</button></header><div class="dbody">${body}</div><footer>${foot}</footer></aside>`;
  }
  function drawerBind() {
    if (!ui.drawer) return;
    const b = D.bnd(ui.b);
    const step = (st, s) => { ui.drawer = { step: st, s: s || null }; render(); const d = $('.drawer .dbody'); d && (d.scrollTop = 0); };
    $('#scrim').addEventListener('click', closeDrawer); $('#dX').addEventListener('click', closeDrawer);
    $('#dDone') && $('#dDone').addEventListener('click', closeDrawer);
    $('#dBack') && $('#dBack').addEventListener('click', () => step('list'));
    document.querySelectorAll('[data-prev]').forEach((c) => c.addEventListener('click', () => step('diff', c.dataset.prev)));
    const sel = $('#addSel'); sel && sel.addEventListener('change', () => sel.value && step('diff', sel.value));
    document.querySelectorAll('[data-remove]').forEach((c) => c.addEventListener('click', () => {
      const s = D.sys(c.dataset.remove); b.members = b.members.filter((m) => m !== s.id); Kit.toast(`${s.name} left ${short(b)}; a Change Event is recorded on the System`); const y = scrollY; render(); scrollTo(0, y);
    }));
    $('#dAdd') && $('#dAdd').addEventListener('click', () => {
      const s = D.sys($('#dAdd').dataset.s), p = D.preview(b, s); b.members.push(s.id); ui.drawer = { step: 'list', s: null };
      Kit.toast(`${s.name} added${p.review ? '; Change Review started' : ''}; a Change Event is recorded on the System`); const y = scrollY; render(); scrollTo(0, y);
    });
  }

  // ================= 4. the System page fragment =================
  function systemView() {
    const s = D.sys(ui.s), sc = D.scope(s), bs = D.boundariesOf(s), t = D.STATE[s.state], grp = D.group(s);
    const src = (r) => {
      const out = [];
      if (r.base) out.push('<span class="chip plain">Base Framework · always</span>');
      if (r.declared) out.push('<span class="neutral">Declared</span>');
      r.via.forEach((b) => out.push(`<span class="fwchip">via ${esc(short(b))}</span>`));
      return out.join('');
    };
    const prepared = (r) => r.declared && !r.via.length && !r.base;
    const scopeRows = sc.map((r) => `<div class="scope-row"><div><b>${esc(r.fw.name)}</b></div><div class="src">${prepared(r) ? `<span class="neutral">Prepared for ${esc(r.fw.short)} · in no Boundary</span>` : src(r)}</div></div>`).join('');
    const prep = sc.filter(prepared);
    const place = grp === 'counted' ? 'inside the perimeter, counted' : grp === 'pending' ? 'on the edge of the perimeter, not yet operating and not counted' : `listed as closed (${t.label}), not counted`;
    const lines = bs.map((b) => `<div class="sline"><span>${link('boundary', { b: b.id }, esc(b.name))} ${b.retired ? chip('', 'Retired') : ''}</span>
      <span>${b.retired ? `Retired ${esc(fmt(b.retired.on))}: it no longer brings ${b.fws.length === 1 ? 'its Framework' : 'its Frameworks'} into scope.` : `${esc(s.name)} is ${place}. It brings in ${esc(list(D.fwOf(b).map((f) => f.short)))}.`}</span>
      <span class="fine">Boundary Owner ${esc(b.owner)}${b.bu ? ' · ' + esc(b.bu) : ''}</span></div>`).join('');
    return `${proto()}${crumbs('<a href="/design/systems/proposal-a.html' + location.hash + '">Systems</a>', esc(s.name))}
    <div class="sys-pick noprint"><span>System</span>${D.SYSTEMS.map((x) => link('system', { s: x.id }, esc(x.name)).replace('<a ', `<a ${x.id === s.id ? 'aria-current="true" ' : ''}`)).join('')}</div>
    <section class="card"><div class="card-b" style="display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <div><div class="eyebrow">System</div><h1>${esc(s.name)}</h1><div class="facts" style="margin-top:8px"><span>${stateChip(s)}</span><span>Business Unit <b>${esc(s.bu)}</b></span><span>Owner <b>${person(s.owner)}</b></span></div></div>
      <p class="fine" style="max-width:48ch">Only the part of the System page that Compliance Boundaries change is drawn here: a card that reads as the System’s place in each scope statement, and the Profile’s Framework scope.</p></div></section>
    <div class="two">
      <section class="card"><div class="card-h"><h2>In scope statements</h2><p>${bs.filter((b) => !b.retired).length} active</p></div><div class="card-b">${lines || `<p style="color:var(--muted)">${esc(s.name)} is in no Boundary.</p>`}
        <p class="fine" style="margin-top:10px">${who().key === 'SYSTEM_OWNER' && who().person === s.owner ? 'You see which Boundaries this System is in, but only a Boundary Owner, a Compliance Manager or an Admin can remove it from one.' : 'Read-only here. The Boundary Owner, a Compliance Manager or an Admin edits membership from the Boundary’s scope statement.'} A join or a leave is a Change Event on this System.</p></div></section>
      <section class="card"><div class="card-h"><h2>Profile · Frameworks in scope</h2><p>Declared, plus every Boundary the System is in</p></div><div class="card-b">${scopeRows}
        ${prep.length ? `<p class="fine" style="margin-top:8px">Prepared is a normal state, not a gap: the Controls of ${esc(prep.map((r) => r.fw.name).join(' and '))} already apply and are assessed, so ${esc(s.name)} appears as a candidate wherever a Boundary needs ${prep.length === 1 ? 'it' : 'them'}.</p>` : ''}</div></section>
    </div>`;
  }

  // ---- render ----
  function render() {
    const root = $('#page');
    root.innerHTML = ui.view === 'boundary' ? boundaryView() : ui.view === 'statement' ? statementOnly() : ui.view === 'system' ? systemView() : listView();
    document.title = ({ list: 'Compliance Boundaries', boundary: D.bnd(ui.b).name, statement: 'Statement: ' + D.bnd(ui.b).name, system: D.sys(ui.s).name })[ui.view] + ' · design';
    root.querySelectorAll('[data-go]').forEach((a) => a.addEventListener('click', (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault();
      const g = JSON.parse(a.dataset.go); go(g.view, { ...(g.b ? { b: g.b } : {}), ...(g.s ? { s: g.s } : {}) });
    }));
    if (ui.view === 'list') listBind();
    if (ui.view === 'boundary' || ui.view === 'statement') docBind();
    if (ui.view === 'boundary') drawerBind();
    Kit.countUp(root);
  }

  Appbar.mount({
    current: 'boundaries',
    proposal: { label: 'C', siblings: [['A', 'proposal-a.html'], ['B', 'proposal-b.html']] },
    items: () => D.BOUNDARIES.map((b) => ({ group: 'Compliance Boundaries', label: b.name, sub: b.retired ? 'Retired' : b.fws.map((f) => D.FW[f].short).join(', '), icon: 'boundary', run: () => go('boundary', { b: b.id }) }))
      .concat(D.BOUNDARIES.filter((b) => !b.retired).map((b) => ({ group: 'Statements of Applicability', label: 'Statement: ' + b.name, icon: 'soa', run: () => go('statement', { b: b.id }) })))
      .concat(D.SYSTEMS.map((s) => ({ group: 'Systems', label: s.name, sub: 'Scope statements on the System page', icon: 'system', run: () => go('system', { s: s.id }) }))),
  });
  render();
})();
</script>
</body>
</html>
