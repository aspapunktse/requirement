<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Theme Menu in the Header</title>
<link rel="stylesheet" href="../systems/systems.css">

.page-note { color: var(--muted); font-size: .84rem; }

<body>
<header id="appbar"></header>
<main class="app">
  <p class="page-note">Proposal A: open <b>Theme</b> in the header. The sample page below is a stand-in for any page in the app.</p>
  <div id="demo"></div>
</main>

<script src="../shared/kit.js"></script>
<script src="demo.js"></script>
<script src="../shared/appbar.js"></script>
<script>
// Proposal A shipped (#286): the Theme menu now lives in the shared header (shared/appbar.js), so every /design page
// has it. This page only shows the sample app page under it.
ThemeDemo.mount(document.getElementById('demo'));
Appbar.mount({ current: 'systems', proposal: { label: 'A', siblings: [['B', 'proposal-b.html'], ['C', 'proposal-c.html']] } });
</script>
