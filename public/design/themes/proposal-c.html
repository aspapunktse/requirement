<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Compare and Check Themes</title>
<link rel="stylesheet" href="../systems/systems.css">
<link rel="stylesheet" href="../shared/appbar.css">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="../shared/themes.css">
<link rel="stylesheet" href="demo.css">
<script src="../shared/themes.js"></script>
<style>
/* Proposal C: pick two themes and see the same page in both, side by side or behind a split slider. A layout
   check outlines every box and measures the two pages against each other; a contrast readout computes the
   WCAG 2.1 ratios from each theme's tokens in light and dark. The theme you like is applied to the whole page. */
.head h1 { font-size: clamp(1.5rem, 3vw, 2rem); }
.head p { color: var(--muted); margin-top: 4px; max-width: 68ch; }
.ctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding: 14px 18px 16px; align-items: start; }
.ctl > * { min-width: 0; }
.ctl fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.ctl legend { font-size: .72rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 6px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pk { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--control, var(--line)); background: var(--surface); border-radius: 10px; padding: 5px 10px 5px 6px; cursor: pointer; font: inherit; font-size: .84rem; font-weight: 650; color: var(--ink); }
.pk:hover { border-color: var(--accent); }
.pk[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pk .sw i { width: 8px; height: 16px; } .pk .sw { border-radius: 5px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--control, var(--line)); border-radius: 10px; background: var(--surface); }
.tg button { border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: .82rem; font-weight: 650; padding: 5px 11px; cursor: pointer; }
.tg button:hover { color: var(--ink); }
.tg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 750; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; font-size: .86rem; cursor: pointer; }

.caps { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.cap b { font-size: 1rem; } .cap small { color: var(--muted); }
.stage { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.stage > .dm { border: 1px solid var(--line); border-radius: 16px; }
.stage.split { display: block; border: 1px solid var(--line); border-radius: 16px; overflow: clip; }
.stage.split > .dm { border: 0; border-radius: 0; }
.stage.split > .p2 { position: absolute; top: 0; left: 0; width: 100%; clip-path: inset(0 0 0 var(--cut, 50%)); }
.stage .cut { display: none; }
.stage.split .cut { display: block; position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 3px; margin-left: -1.5px; background: var(--ink); z-index: 20; pointer-events: none; }
.stage.split .cut::after { content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--ink); color: var(--paper); border-radius: 99px; width: 28px; height: 28px; display: grid; place-items: center; font-size: .9rem; }
.slide { display: none; padding: 0 0 4px; }
.slide.on { display: block; }
.slide input { width: 100%; accent-color: var(--accent); height: 24px; }
@media (max-width: 1100px) { .stage:not(.split) { grid-template-columns: 1fr; } .caps { grid-template-columns: 1fr; } }

.read { padding: 4px 0 8px; }
.read table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.read caption { text-align: left; padding: 0 18px 8px; color: var(--muted); font-size: .8rem; }
.read th, .read td { padding: 7px 8px; border-top: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
.read th:first-child, .read td:first-child { padding-left: 18px; }
.read th:last-child, .read td:last-child { padding-right: 18px; }
.read thead th { font-size: .7rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-top: 0; background: var(--raised); }
.read td small { display: block; color: var(--muted); font-size: .74rem; }
.read .cur { background: var(--accent-soft); }
.rat { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pf { display: inline-flex; align-items: center; gap: 4px; font-weight: 750; font-size: .76rem; padding: 0 7px; border-radius: 99px; margin-left: 4px; }
.pf.ok { background: var(--ok-soft); color: var(--ok); } .pf.no { background: var(--bad-soft); color: var(--bad); }
.sum { padding: 4px 18px 14px; font-weight: 650; font-size: .86rem; }
.read-wrap { overflow-x: auto; }
.read-wrap table { min-width: 460px; }
.rd { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 1100px) { .rd { grid-template-columns: 1fr; } }

.lay { padding: 12px 18px 16px; display: grid; gap: 8px; font-size: .86rem; }
.lay[hidden] { display: none; }
.lay .big { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lay ul { margin: 0; padding-left: 18px; color: var(--muted); }
.lay code { font-family: var(--mono); font-size: .78rem; background: var(--raised); border: 1px solid var(--line-soft); padding: 0 4px; border-radius: 4px; }
.th-live { position: absolute; left: -9999px; }
</style>
</head>
<body>
<header id="appbar"></header>
<main class="app">
  <div class="head">
    <h1>Compare and check themes</h1>
    <p>Pick two themes to see the same page in both, then run the checks: the layout must line up and every pair of colours must pass WCAG 2.1 AA. The mode is the one in the header.</p>
  </div>

  <section class="card" aria-label="Controls">
    <div class="ctl">
      <fieldset><legend id="lgL">Left theme</legend><div class="pick" role="radiogroup" aria-labelledby="lgL" id="pickL"></div></fieldset>
      <fieldset><legend id="lgR">Right theme</legend><div class="pick" role="radiogroup" aria-labelledby="lgR" id="pickR"></div></fieldset>
      <fieldset><legend>View</legend><div class="opts">
        <div class="tg" role="group" aria-label="View"><button type="button" data-view="side" aria-pressed="true">Side by side</button><button type="button" data-view="split" aria-pressed="false">Split slider</button></div>
        <label class="chk"><input type="checkbox" id="lc"> Layout check</label>
      </div></fieldset>
    </div>
    <div class="slide" id="slide"><div style="padding:0 18px"><label for="cut" class="muted" style="font-size:.8rem">Split position: left of the handle is the left theme, right of it the right theme</label><input type="range" id="cut" min="0" max="100" value="50"></div></div>
  </section>

  <section class="card lay" id="lay" hidden aria-label="Layout check" aria-live="polite"></section>

  <div class="caps" id="caps"></div>
  <div class="stage" id="stage"><div id="p1"></div><div id="p2" class="p2"></div><div class="cut" aria-hidden="true"></div></div>

  <section class="rd" aria-label="Contrast">
    <section class="card" aria-labelledby="rdL"><div class="card-h"><h2 id="rdL">Contrast: <span id="nmL"></span></h2><p>WCAG 2.1 AA</p></div><div class="read read-wrap" id="readL"></div></section>
    <section class="card" aria-labelledby="rdR"><div class="card-h"><h2 id="rdR">Contrast: <span id="nmR"></span></h2><p>WCAG 2.1 AA</p></div><div class="read read-wrap" id="readR"></div></section>
  </section>
</main>
<div class="th-live" role="status" aria-live="polite" id="thLive"></div>

<script src="../shared/kit.js"></script>
<script src="demo.js"></script>
<script src="../shared/appbar.js"></script>
<script>
(function () {
  const { esc } = window.Kit;
  const $ = (id) => document.getElementById(id);
  const say = (m) => { $('thLive').textContent = m; };
  const side = { L: 'register', R: Themes.saved() === 'register' ? 'slate' : Themes.saved() };
  let view = 'side', lc = false;
  const panels = { L: $('p1'), R: $('p2') };
  ThemeDemo.mount(panels.L, { palette: side.L });
  ThemeDemo.mount(panels.R, { palette: side.R });
  Themes.loadFonts(side.L); Themes.loadFonts(side.R);

  // ---- Contrast, computed from the tokens each theme resolves to (probes force light and dark) ----
  const hex = (v) => { v = v.trim(); const m = v.match(/^#([0-9a-f]{6})$/i); if (m) return [0, 2, 4].map((i) => parseInt(m[1].substr(i, 2), 16)); const r = v.match(/rgba?\((\d+)[ ,]+(\d+)[ ,]+(\d+)/); return r ? [+r[1], +r[2], +r[3]] : [0, 0, 0]; };
  const lum = (rgb) => { const c = rgb.map((v) => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
  const ratio = (a, b) => { const x = lum(hex(a)), y = lum(hex(b)); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const tokens = (id, mode) => {
    const p = document.createElement('div'); p.setAttribute('data-palette', id); p.setAttribute('data-mode', mode); p.style.cssText = 'position:absolute;left:-9999px;width:0;height:0';
    document.body.appendChild(p); const cs = getComputedStyle(p);
    const t = {}; ['paper', 'surface', 'raised', 'line', 'control', 'ink', 'muted', 'faint', 'accent', 'accent-soft', 'on-accent', 'gold-ink', 'gold-soft', 'ok', 'ok-soft', 'bad', 'bad-soft', 'done', 'done-soft'].forEach((k) => { t[k] = cs.getPropertyValue('--' + k); });
    p.remove(); return t;
  };
  // [label, hint, min, fn(tokens) -> ratio]
  const CHECKS = [
    ['Body text', 'ink on surface', 4.5, (t) => ratio(t.ink, t.surface)],
    ['Muted text', 'labels, descriptions', 4.5, (t) => ratio(t.muted, t.surface)],
    ['Faint text', 'hints, counts, small print', 4.5, (t) => ratio(t.faint, t.surface)],
    ['Accent on surface', 'links, active tab, text buttons', 4.5, (t) => ratio(t.accent, t.surface)],
    ['On-accent on accent', 'primary button', 4.5, (t) => ratio(t['on-accent'], t.accent)],
    ['On-accent on danger', 'danger button', 4.5, (t) => ratio(t['on-accent'], t.bad)],
    ['Status chips', 'worst of success, warning, danger, done', 4.5, (t) => Math.min(ratio(t.ok, t['ok-soft']), ratio(t.bad, t['bad-soft']), ratio(t['gold-ink'], t['gold-soft']), ratio(t.done, t['done-soft']))],
    ['Control border', 'inputs, selects, secondary buttons', 3, (t) => ratio(t.control, t.surface)],
    ['Focus ring', 'accent on paper and on surface', 3, (t) => Math.min(ratio(t.accent, t.paper), ratio(t.accent, t.surface))],
  ];
  function readout(id) {
    const modes = { light: tokens(id, 'light'), dark: tokens(id, 'dark') }, cur = ThemeDemo.mode();
    let fails = 0;
    const rows = CHECKS.map(([l, h, min, fn]) => `<tr><th scope="row" style="font-weight:650;text-transform:none;letter-spacing:0;font-size:.82rem;color:var(--ink);background:none">${esc(l)}<small>${esc(h)} · needs ${min}:1</small></th>${['light', 'dark'].map((m) => {
      const r = fn(modes[m]), ok = r >= min; if (!ok) fails++;
      return `<td class="${m === cur ? 'cur' : ''}"><span class="rat">${r.toFixed(1)}:1</span> <span class="pf ${ok ? 'ok' : 'no'}">${ok ? '✓ Pass' : '✕ Fail'}</span></td>`;
    }).join('')}</tr>`).join('');
    return `<table><caption>Computed from the theme's tokens. The column for the current mode (${cur}) is shaded.</caption><thead><tr><th scope="col">Pair</th><th scope="col">Light</th><th scope="col">Dark</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="sum">${fails ? `<span class="pf no">✕ ${fails} of ${CHECKS.length * 2} checks fail</span>` : `<span class="pf ok">✓ All ${CHECKS.length * 2} checks pass</span>`}</p>`;
  }

  // ---- Layout check: the two pages, element by element ----
  const path = (el, root) => { const out = []; while (el && el !== root) { const c = el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/)[0] : ''; out.unshift(el.tagName.toLowerCase() + c); el = el.parentElement; } return out.slice(-3).join(' > '); };
  function measure(root) { const r0 = root.getBoundingClientRect(); return [root, ...root.querySelectorAll('*')].filter((e) => !(e instanceof SVGElement) && e.offsetParent !== null || e === root).map((e) => { const r = e.getBoundingClientRect(); return { e, x: r.left - r0.left, y: r.top - r0.top, w: r.width, h: r.height }; }); }
  function layoutCheck() {
    const box = $('lay');
    box.hidden = !lc; if (!lc) return;
    const a = measure(panels.L), b = measure(panels.R);
    if (a.length !== b.length) { box.innerHTML = `<div class="big">✕ The two pages have a different number of boxes (${a.length} vs ${b.length}).</div>`; return; }
    let same = 0, horiz = 0, moved = []; // horiz: only x or width differs (a font's letter widths); moved: a line wrapped or a box shifted vertically
    a.forEach((p, i) => {
      const q = b[i], dx = q.x - p.x, dy = q.y - p.y, dw = q.w - p.w, dh = q.h - p.h;
      if (Math.abs(dy) > 1.01 || Math.abs(dh) > 1.01) moved.push({ p: path(p.e, panels.L), dx, dy, dw, dh });
      else if (Math.abs(dx) > 1.01 || Math.abs(dw) > 1.01) horiz++;
      else same++;
    });
    const hL = panels.L.getBoundingClientRect().height, hR = panels.R.getBoundingClientRect().height, dH = hR - hL;
    const moves = moved.sort((x, y) => Math.abs(y.dy) + Math.abs(y.dh) - Math.abs(x.dy) - Math.abs(x.dh)).slice(0, 4);
    const ok = !moved.length && Math.abs(dH) < 1.01;
    box.innerHTML = `<div class="big"><span class="pf ${ok ? 'ok' : 'no'}">${ok ? '✓ Lines up' : '✕ Reflows'}</span> ${a.length} boxes compared: ${same} identical (within 1px), ${horiz} differ only sideways (the width of text-sized boxes, from the font's letter widths), ${moved.length} moved or changed height (a line wrapped differently).</div>
      <ul><li>Page height: ${hL.toFixed(1)}px vs ${hR.toFixed(1)}px (${dH >= 0 ? '+' : ''}${dH.toFixed(1)}px).</li>
      ${moves.map((m) => `<li><code>${esc(m.p)}</code> moved ${m.dx.toFixed(1)}, ${m.dy.toFixed(1)} and resized ${m.dw.toFixed(1)} × ${m.dh.toFixed(1)}px</li>`).join('')}
      <li>The red outlines on both pages are every box: they sit in the same places, only colours and glyphs change.</li></ul>`;
  }
  let lcTimer; const scheduleCheck = () => { clearTimeout(lcTimer); lcTimer = setTimeout(layoutCheck, 120); };

  // ---- Render ----
  const pickHtml = (k) => Themes.list.map((t) => `<button type="button" class="pk" role="radio" data-side="${k}" data-id="${t.id}" aria-checked="${side[k] === t.id}" tabindex="${side[k] === t.id ? 0 : -1}">${ThemeDemo.swatch(t.id)}${esc(t.name)}</button>`).join('');
  function refresh() {
    $('pickL').innerHTML = pickHtml('L'); $('pickR').innerHTML = pickHtml('R');
    ['L', 'R'].forEach((k) => {
      const t = Themes.get(side[k]); panels[k].setAttribute('data-palette', t.id); Themes.loadFonts(t.id);
      $('nm' + k).textContent = t.name; $('read' + k).innerHTML = readout(t.id);
    });
    $('caps').innerHTML = ['L', 'R'].map((k) => { const t = Themes.get(side[k]); return `<div class="cap"><div><b>${esc(t.name)}</b> <small>${esc(t.sans)} · ${esc(t.mono)}</small></div><button type="button" class="btn" data-use="${k}"${Themes.saved() === t.id ? ' aria-pressed="true"' : ''}>${Themes.saved() === t.id ? '✓ Used by this page' : 'Use this theme'}</button></div>`; }).join('');
    scheduleCheck();
  }
  function setView(v) {
    view = v; const s = $('stage'); s.classList.toggle('split', v === 'split'); $('slide').classList.toggle('on', v === 'split');
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    panels.L.toggleAttribute('inert', v === 'split'); panels.R.toggleAttribute('inert', v === 'split');
    scheduleCheck();
  }
  document.addEventListener('click', (e) => {
    const pk = e.target.closest('.pk'); if (pk) { side[pk.dataset.side] = pk.dataset.id; refresh(); const n = document.querySelector(`.pk[data-side="${pk.dataset.side}"][data-id="${pk.dataset.id}"]`); n && n.focus(); say(Themes.get(pk.dataset.id).name + ' shown'); return; }
    const v = e.target.closest('[data-view]'); if (v) return setView(v.dataset.view);
    const u = e.target.closest('[data-use]'); if (u) { Themes.set(side[u.dataset.use]); say(Themes.get(side[u.dataset.use]).name + ' theme applied to this page'); }
  });
  document.addEventListener('keydown', (e) => {
    const pk = e.target.closest && e.target.closest('.pk'); if (!pk) return;
    const items = [...pk.parentElement.querySelectorAll('.pk')]; let i = items.indexOf(pk);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') i = (i + 1) % items.length; else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') i = (i - 1 + items.length) % items.length; else if (e.key === 'Home') i = 0; else if (e.key === 'End') i = items.length - 1; else return;
    e.preventDefault(); items[i].click();
  });
  $('lc').addEventListener('change', (e) => { lc = e.target.checked; ['L', 'R'].forEach((k) => panels[k].classList.toggle('outline', lc)); layoutCheck(); });
  $('cut').addEventListener('input', (e) => { $('stage').style.setProperty('--cut', e.target.value + '%'); });
  addEventListener('resize', scheduleCheck);
  addEventListener('themes:change', refresh);
  ThemeDemo.onMode(refresh);
  if (document.fonts) { document.fonts.addEventListener('loadingdone', scheduleCheck); document.fonts.ready.then(scheduleCheck); }

  Appbar.mount({ current: 'systems', proposal: { label: 'C', siblings: [['A', 'proposal-a.html'], ['B', 'proposal-b.html']] },
    items: () => Themes.list.map((x) => ({ group: 'Theme', label: x.name, sub: x.sans, icon: 'grid', run: () => Themes.set(x.id) })) });
  refresh(); setView('side');
})();
</script>
</body>
</html>
