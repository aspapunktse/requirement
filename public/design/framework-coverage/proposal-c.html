<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Coverage Crosswalk</title>
<link rel="stylesheet" href="../systems/systems.css">
<link rel="stylesheet" href="../shared/appbar.css">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="../frameworks/fw.css">
<style>
/* Proposal C: a crosswalk workbench for mapping a Framework onto the Control Library.
   "Biggest wins" lists Controls whose Partial mappings, made Full, would close several gaps at
   once (implement once, satisfy many). Below, the Requirements on the left and the Control
   Library on the right: pick a Requirement and map a Control with a click, or drag a Control
   onto any Requirement. A strip of section bars jumps through the list. */
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.head .t { display: flex; gap: 14px; align-items: center; min-width: 0; }
.head h1 { font-size: 1.5rem; letter-spacing: -0.01em; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.head h1 code { font-family: var(--mono); font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.head .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; font-size: .8rem; color: var(--muted); }
.head .right { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 760px) { .head { grid-template-columns: 1fr; } .head .right { justify-content: flex-start; } }
.kpis { display: flex; gap: 16px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.kpis b { color: var(--ink); font-size: 1.05rem; font-variant-numeric: tabular-nums; margin-right: 4px; }
.kpis .bad b { color: var(--bad); }

.wins { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 0 18px 16px; }
.win { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; background: linear-gradient(160deg, var(--surface), color-mix(in srgb, var(--ok-soft) 50%, var(--surface))); }
.win .c { display: flex; gap: 8px; align-items: baseline; }
.win .c b { font-family: var(--mono); color: var(--accent); font-size: .8rem; }
.win .c span { font-weight: 650; font-size: .86rem; }
.win .n { font-size: 1.8rem; font-weight: 780; color: var(--ok); line-height: 1; font-variant-numeric: tabular-nums; }
.win .n small { font-size: .78rem; font-weight: 600; color: var(--muted); margin-left: 4px; }
.win .codes { display: flex; flex-wrap: wrap; gap: 4px; }
.win .codes span { font-family: var(--mono); font-size: .68rem; background: var(--raised); border: 1px solid var(--line-soft); border-radius: 5px; padding: 0 5px; color: var(--muted); }
.win .acts { display: flex; gap: 6px; }

.strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.strip button { flex: 1 0 64px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 8px; cursor: pointer; display: grid; gap: 5px; text-align: left; }
.strip button:hover { border-color: var(--accent); }
.strip button b { font-family: var(--mono); font-size: .72rem; display: flex; justify-content: space-between; gap: 6px; }
.strip button b small { color: var(--bad); }
.strip .cbar { min-width: 0; height: 5px; }

.bench { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .bench { grid-template-columns: 1fr; } }
.pane { overflow: clip; display: flex; flex-direction: column; }
.ptool { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.ptool .search { flex: 1 1 180px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: .78rem; font-weight: 650; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-soft); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.rlist { overflow-y: auto; max-height: calc(100vh - 150px); min-height: 360px; }
.rsec { position: sticky; top: 0; z-index: 1; padding: 7px 14px; font-size: .7rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--raised); border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; }
.req { display: grid; grid-template-columns: 10px 112px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line-soft); cursor: pointer; font-size: .84rem; transition: background .12s; }
.req:hover { background: var(--raised); }
.req[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
.req.drop { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); box-shadow: inset 0 0 0 2px var(--ok); }
.req > i { width: 10px; height: 10px; border-radius: 3px; }
.req code { font-family: var(--mono); font-size: .72rem; font-weight: 700; color: var(--accent); }
.req .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.req .mc { display: flex; gap: 3px; }
.req .mc span { font-family: var(--mono); font-size: .64rem; border-radius: 4px; padding: 0 4px; }
.req .mc .FULL { background: var(--ok-soft); color: var(--ok); } .req .mc .PARTIAL { background: var(--gold-soft); color: var(--gold-ink); }
@media (max-width: 560px) { .req { grid-template-columns: 10px minmax(0, 1fr); } .req .tt { grid-column: 2; } .req .mc { display: none; } }

.focus { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); display: grid; gap: 10px; background: linear-gradient(135deg, var(--surface), color-mix(in srgb, var(--accent-soft) 50%, var(--surface))); }
.focus h2 { font-size: 1rem; } .focus h2 code { font-family: var(--mono); color: var(--accent); font-size: .82rem; display: block; }
.focus .mapped { display: grid; gap: 5px; }
.focus .mapped > div { display: flex; gap: 6px; align-items: center; }
.focus .mapped .ctl { flex: 1; min-width: 0; }
.focus .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.lib { overflow-y: auto; max-height: 520px; }
.lc { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line-soft); font-size: .82rem; cursor: grab; background: var(--surface); }
.lc:hover { background: var(--raised); }
.lc.dragging { opacity: .5; }
.lc b { font-family: var(--mono); font-size: .74rem; color: var(--accent); }
.lc .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lc small { grid-column: 2; color: var(--faint); font-size: .7rem; }
.lc .bt { display: flex; gap: 4px; grid-row: span 2; }
.lc .grip { color: var(--faint); grid-row: span 2; letter-spacing: -2px; }
.lc.sugg { background: color-mix(in srgb, var(--accent-soft) 60%, var(--surface)); }
.lc.sugg small::before { content: "Suggested · "; color: var(--accent); font-weight: 700; }
.hint { font-size: .74rem; color: var(--faint); padding: 8px 14px; }
</style>
</head>
<body>
<header id="appbar"></header>
<main class="app">
  <a class="back" id="back" href="#">← Frameworks</a>
  <section class="head">
    <div class="t"><div id="ring"></div><div><p class="eyebrow">Framework coverage · crosswalk</p><h1 id="h1"></h1><div class="meta" id="meta"></div></div></div>
    <div class="right" id="right"></div>
  </section>
  <div class="kpis" id="kpis"></div>
  <section class="card" id="winsCard" aria-labelledby="wh">
    <div class="card-h"><h2 id="wh">Biggest wins</h2><p>Controls already mapped Partial to several open gaps. Making the mapping Full closes them all.</p></div>
    <div class="card-b" style="padding:12px 0 0"><div class="wins" id="wins"></div></div>
  </section>
  <nav class="strip" id="strip" aria-label="Sections"></nav>
  <div class="bench">
    <section class="card pane" aria-label="Requirements">
      <div class="ptool">
        <label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4a5 5 0 1 0 0 10A5 5 0 0 0 9 4zM13 13l4 4"/></svg><input id="rq" type="search" placeholder="Find a Requirement" aria-label="Find a Requirement"></label>
        <div class="seg" id="rf" role="group" aria-label="Show"><button data-f="all" aria-pressed="false">All</button><button data-f="GAP" aria-pressed="true">Gaps</button><button data-f="ACCEPTED_GAP" aria-pressed="false">Accepted</button><button data-f="COVERED" aria-pressed="false">Covered</button></div>
      </div>
      <div class="rlist" id="rlist" role="listbox" aria-label="Requirements"></div>
    </section>
    <section class="card pane" aria-label="Selected Requirement and Control Library">
      <div class="focus" id="focus"></div>
      <div class="ptool">
        <label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4a5 5 0 1 0 0 10A5 5 0 0 0 9 4zM13 13l4 4"/></svg><input id="lq" type="search" placeholder="Search the Control Library" aria-label="Search the Control Library"></label>
        <select class="sel" id="theme" aria-label="Theme"><option value="">All themes</option><option>A.5 Organizational</option><option>A.6 People</option><option>A.7 Physical</option><option>A.8 Technological</option><option value="SUP">Supplementary</option></select>
      </div>
      <div class="lib" id="lib"></div>
      <p class="hint" id="hint"></p>
    </section>
  </div>
</main>

<script src="../frameworks/data.js"></script>
<script src="../shared/kit.js"></script>
<script src="../shared/appbar.js"></script>
<script src="../frameworks/fw.js"></script>
<script src="coverage.js"></script>
<script>
const { fw, reqs } = Cov; const esc = FW.esc;
const S = { f: 'GAP', q: '', lq: '', theme: '', sel: null };
if (!reqs.some((r) => r.state === 'GAP')) S.f = 'all';
document.querySelectorAll('#rf button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === S.f)));

function renderHead() {
  const c = Cov.counts();
  document.title = `${FW.label(fw)} crosswalk`;
  document.getElementById('back').href = Cov.listHref('c');
  document.getElementById('ring').innerHTML = Kit.ring([[c.covered / c.requirements, 'var(--c-cov)'], [c.accepted / c.requirements, 'var(--c-acc)']], 64, 8, Math.round((c.covered + c.accepted) / c.requirements * 100) + '%');
  document.getElementById('h1').innerHTML = `${esc(fw.name)} <code>${esc(fw.version)}</code>`;
  document.getElementById('meta').innerHTML = FW.status(fw) + FW.tags(fw) + `<span>${esc(fw.licensing)}</span>`;
  document.getElementById('right').innerHTML = Cov.switcher('c') + '<button class="btn" type="button" onclick="Kit.toast(\'coverage.csv downloaded\')">Download CSV</button>';
  document.getElementById('kpis').innerHTML = `<span><b>${c.requirements}</b>Requirements</span><span><b>${c.covered}</b>covered</span><span class="bad"><b>${c.gaps}</b>open gaps</span><span><b>${c.partialOnly}</b>Partial only</span><span><b>${c.accepted}</b>accepted</span><span>${FW.legend()}</span>`;
}
function renderWins() {
  const w = Cov.wins().filter((x) => x.reqs.length >= 2).slice(0, 6), cur = FW.canCurate();
  document.getElementById('winsCard').hidden = !w.length;
  document.getElementById('wins').innerHTML = w.map((x) => `<div class="win"><div class="c"><b>${esc(x.control.code)}</b><span>${esc(x.control.title)}</span></div>
    <div class="n">${x.reqs.length}<small>gaps close if Full</small></div>
    <div class="codes">${x.reqs.map((r) => `<span>${esc(r.code.split('-').pop())}</span>`).join('')}</div>
    <div class="acts"><button class="btn sm" type="button" data-review="${esc(x.control.code)}">Review</button>${cur ? `<button class="btn sm primary" type="button" data-upgrade="${esc(x.control.code)}">Make Full on ${x.reqs.length}</button>` : ''}</div></div>`).join('');
}
function renderStrip() {
  document.getElementById('strip').innerHTML = FW.sections(reqs).map(([s, rs]) => { const c = FW.recount(rs); return `<button type="button" data-sec="${esc(s)}" title="${esc(s)}"><b>${esc(s.split(' ')[0])}${c.gaps ? `<small>${c.gaps}</small>` : ''}</b>${FW.bar(c, 'thin')}</button>`; }).join('');
}
const visibleReqs = () => { const q = S.q.toLowerCase(); return reqs.filter((r) => S.f === 'all' || r.state === S.f).filter((r) => !q || (r.code + ' ' + r.title).toLowerCase().includes(q)); };
function renderList() {
  const list = visibleReqs();
  if (!S.sel || !reqs.some((r) => r.code === S.sel)) S.sel = (list[0] || reqs[0]).code;
  document.getElementById('rlist').innerHTML = FW.sections(list).map(([s, rs]) => `<div class="rsec" id="sec-${encodeURIComponent(s)}"><span>${esc(s)}</span><span>${rs.length}</span></div>` +
    rs.map((r) => `<div class="req" role="option" tabindex="0" data-code="${esc(r.code)}" aria-selected="${r.code === S.sel}"><i class="st-${FW.kind(r)}" title="${FW.STATE_LABEL[r.state]}"></i><code>${esc(r.code)}</code><span class="tt" title="${esc(r.title)}">${esc(r.title)}</span><span class="mc">${r.maps.map((m) => `<span class="${m.coverage}">${esc(m.control)}</span>`).join('')}</span></div>`).join('')).join('')
    || `<div class="done-state">${Kit.CHECK}<h3>${S.f === 'GAP' ? 'No open gaps' : 'Nothing matches'}</h3><p>${S.f === 'GAP' ? 'Every Requirement is covered or accepted.' : 'Try another filter.'}</p></div>`;
}
function renderFocus() {
  const r = Cov.find(S.sel), cur = FW.canCurate();
  document.getElementById('focus').innerHTML = `<div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><h2><code>${esc(r.code)}</code>${esc(r.title)}</h2>${FW.cst(r.state)}</div>
    <div class="mapped">${r.maps.length ? r.maps.map((m) => `<div>${FW.ctl(m)}${cur ? `${m.coverage === 'PARTIAL' ? `<button class="btn sm" type="button" data-full="${esc(m.control)}">Make Full</button>` : ''}<button class="btn sm ghost" type="button" data-rm="${esc(m.control)}" aria-label="Remove ${esc(m.control)}">×</button>` : ''}</div>`).join('') : '<span class="nomap">No Control mapped</span>'}</div>
    ${r.state === 'ACCEPTED_GAP' ? `<p class="muted" style="font-size:.8rem">Accepted: “${esc(r.justification)}”</p>` : ''}
    <div class="acts">${cur && r.state === 'GAP' ? '<button class="btn sm" type="button" data-open="create">Create Supplementary…</button><button class="btn sm" type="button" data-open="accept">Accept gap…</button>' : ''}<button class="btn sm ghost" type="button" data-open="">All details</button></div>`;
  document.getElementById('hint').textContent = cur ? `Map with a button, or drag a Control onto any Requirement on the left (mapped Full).` : 'Read-only: a Compliance Manager maps Controls.';
}
function renderLib() {
  const r = Cov.find(S.sel), cur = FW.canCurate(), q = S.lq.toLowerCase();
  const sug = r.state !== 'COVERED' ? Cov.suggest(r, 3).map((c) => c.code) : [];
  const supp = Object.values(FW.DETAIL).flat().flatMap((x) => x.maps).filter((m) => m.supplementary).map((m) => ({ code: m.control, title: m.title, theme: 'SUP' }));
  const uniq = new Map(); supp.forEach((c) => uniq.set(c.code, c));
  let lib = FW.BASE.concat([...uniq.values()]).filter((c) => !S.theme || c.theme === S.theme).filter((c) => !q || (c.code + ' ' + c.title).toLowerCase().includes(q)).filter((c) => !r.maps.some((m) => m.control === c.code));
  lib.sort((a, b) => sug.indexOf(b.code) - sug.indexOf(a.code) || 0);
  if (!q && !S.theme) lib = sug.map((s) => lib.find((c) => c.code === s)).filter(Boolean).concat(lib.filter((c) => !sug.includes(c.code)));
  const uses = (code) => reqs.filter((x) => x.maps.some((m) => m.control === code)).length;
  document.getElementById('lib').innerHTML = lib.slice(0, 120).map((c) => `<div class="lc${sug.includes(c.code) ? ' sugg' : ''}" draggable="${cur}" data-ctl="${esc(c.code)}"><span class="grip" aria-hidden="true">⋮⋮</span><span><b>${esc(c.code)}</b> <span class="tt">${esc(c.title)}</span></span>
    ${cur ? `<span class="bt"><button class="btn sm" type="button" data-map="FULL" data-c="${esc(c.code)}">Full</button><button class="btn sm" type="button" data-map="PARTIAL" data-c="${esc(c.code)}">Partial</button></span>` : '<span></span>'}
    <small>${uses(c.code) ? `Mapped to ${uses(c.code)} here` : 'Not used by this Framework yet'}</small></div>`).join('') || '<p class="hint">No Control matches.</p>';
}
function renderAll() { renderHead(); renderWins(); renderStrip(); renderList(); renderFocus(); renderLib(); }
function select(code) { S.sel = code; document.querySelectorAll('.req').forEach((el) => el.setAttribute('aria-selected', String(el.dataset.code === code))); renderFocus(); renderLib(); }
Cov.onChange(renderAll);

document.getElementById('rlist').addEventListener('click', (e) => { const el = e.target.closest('.req'); if (el) select(el.dataset.code); });
document.getElementById('rlist').addEventListener('keydown', (e) => {
  const els = [...document.querySelectorAll('.req')], i = els.findIndex((x) => x.dataset.code === S.sel);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = els[Math.max(0, Math.min(els.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; if (n) { select(n.dataset.code); n.focus(); } }
  if (e.key === 'Enter') Cov.openDrawer(S.sel, () => visibleReqs().map((r) => r.code));
});
document.getElementById('rf').addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (!b) return; S.f = b.dataset.f; document.querySelectorAll('#rf button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); S.sel = null; renderList(); renderFocus(); renderLib(); });
document.getElementById('rq').addEventListener('input', (e) => { S.q = e.target.value; renderList(); });
document.getElementById('lq').addEventListener('input', (e) => { S.lq = e.target.value; renderLib(); });
document.getElementById('theme').addEventListener('change', (e) => { S.theme = e.target.value; renderLib(); });
document.getElementById('strip').addEventListener('click', (e) => { const b = e.target.closest('[data-sec]'); if (!b) return; if (S.f !== 'all' && !visibleReqs().some((r) => r.section === b.dataset.sec)) { S.f = 'all'; document.querySelectorAll('#rf button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.f === 'all'))); renderList(); } const t = document.getElementById('sec-' + encodeURIComponent(b.dataset.sec)); if (t) document.getElementById('rlist').scrollTo({ top: t.offsetTop - document.getElementById('rlist').offsetTop, behavior: 'smooth' }); });
document.getElementById('focus').addEventListener('click', (e) => {
  const r = Cov.find(S.sel), t = (s) => e.target.closest(s);
  if (t('[data-full]')) { const c = t('[data-full]').dataset.full; Cov.act.setCov(r, c, 'FULL'); Cov.changed(`${r.code} is now covered by ${c}`); }
  else if (t('[data-rm]')) { const c = t('[data-rm]').dataset.rm; Cov.act.removeMap(r, c); Cov.changed(`${c} unmapped from ${r.code}`); }
  else if (t('[data-open]')) { const k = t('[data-open]').dataset.open; Cov.openDrawer(r.code, () => visibleReqs().map((x) => x.code)); if (k) setTimeout(() => document.getElementById(k === 'accept' ? 'cvJust' : 'cvSupTitle')?.focus(), 260); }
});
document.getElementById('lib').addEventListener('click', (e) => { const b = e.target.closest('[data-map]'); if (!b) return; const r = Cov.find(S.sel); Cov.act.addMap(r, b.dataset.c, b.dataset.map); Cov.changed(`${b.dataset.c} mapped ${b.dataset.map === 'FULL' ? 'Full' : 'Partial'} to ${r.code}`); });
document.getElementById('wins').addEventListener('click', (e) => {
  const rv = e.target.closest('[data-review]'), up = e.target.closest('[data-upgrade]');
  if (rv) { const w = Cov.wins().find((x) => x.control.code === rv.dataset.review); S.f = 'GAP'; S.q = ''; document.getElementById('rq').value = ''; document.querySelectorAll('#rf button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.f === 'GAP'))); renderList(); select(w.reqs[0].code); Kit.toast(`${w.reqs.length} Requirements map ${w.control.code} Partial: ${w.reqs.map((r) => r.code.split('-').pop()).join(', ')}`); }
  if (up) { const w = Cov.wins().find((x) => x.control.code === up.dataset.upgrade); if (!confirm(`Make ${w.control.code} a Full mapping on ${w.reqs.length} Requirements? Each becomes covered${w.reqs.some((r) => r.state === 'ACCEPTED_GAP') ? ', and accepted gaps lose their acceptance' : ''}.`)) return; w.reqs.forEach((r) => Cov.act.setCov(r, w.control.code, 'FULL')); Cov.changed(`${w.reqs.length} gaps closed by ${w.control.code}`); }
});
// Drag a Control onto a Requirement: map it Full
let dragCode = null;
document.getElementById('lib').addEventListener('dragstart', (e) => { const el = e.target.closest('.lc'); if (!el) return; dragCode = el.dataset.ctl; el.classList.add('dragging'); e.dataTransfer.setData('text/plain', dragCode); e.dataTransfer.effectAllowed = 'copy'; });
document.getElementById('lib').addEventListener('dragend', (e) => { e.target.closest('.lc')?.classList.remove('dragging'); document.querySelectorAll('.req.drop').forEach((x) => x.classList.remove('drop')); });
const rl = document.getElementById('rlist');
rl.addEventListener('dragover', (e) => { const el = e.target.closest('.req'); if (!el || !dragCode) return; e.preventDefault(); document.querySelectorAll('.req.drop').forEach((x) => x !== el && x.classList.remove('drop')); el.classList.add('drop'); });
rl.addEventListener('dragleave', (e) => { e.target.closest('.req')?.classList.remove('drop'); });
rl.addEventListener('drop', (e) => { const el = e.target.closest('.req'); if (!el || !dragCode) return; e.preventDefault(); const r = Cov.find(el.dataset.code); S.sel = r.code; Cov.act.addMap(r, dragCode, 'FULL'); Cov.changed(`${dragCode} mapped Full to ${r.code}`); dragCode = null; });

addEventListener('appbar:role', renderAll);
Appbar.mount({ current: 'frameworks', proposal: { label: 'C', siblings: [['A', 'proposal-a.html?fw=' + fw.id], ['B', 'proposal-b.html?fw=' + fw.id]] },
  items: () => reqs.map((r) => ({ group: FW.label(fw), label: `${r.code} ${r.title}`, sub: FW.STATE_LABEL[r.state], icon: 'framework', run: () => { S.f = 'all'; renderList(); select(r.code); } })) });
renderAll();
</script>
</body>
</html>
