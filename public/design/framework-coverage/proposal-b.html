<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Coverage Mosaic</title>
<link rel="stylesheet" href="../systems/systems.css">
<link rel="stylesheet" href="../shared/appbar.css">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="../frameworks/fw.css">
<style>
/* Proposal B: the SoA Mosaic idea applied to coverage. One sentence and a ring on top, then
   three modes: a mosaic with one tile per Requirement in section rows, a typeset document that
   reads like the standard with its mappings in the margin, and a gap queue that deals the open
   gaps one at a time with suggested Controls and keyboard shortcuts. */
.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center; }
.top h1 { font-size: clamp(1.4rem, 2.4vw, 1.9rem); letter-spacing: -0.02em; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.top h1 code { font-family: var(--mono); font-size: .85rem; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.top .s { color: var(--muted); font-size: 1rem; margin-top: 6px; max-width: 72ch; }
.top .s b { color: var(--ink); } .top .s .bad { color: var(--bad); }
.top .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.top .side { display: grid; gap: 8px; justify-items: end; }
@media (max-width: 820px) { .top { grid-template-columns: auto minmax(0, 1fr); } .top .side { grid-column: 1 / -1; justify-items: start; } }
.modes { display: inline-flex; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.modes button { border: 0; background: transparent; border-radius: 9px; padding: 6px 14px; font-weight: 680; color: var(--muted); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
.modes button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(20, 45, 61, .12); }
.modes .n { font-size: .7rem; background: var(--bad-soft); color: var(--bad); border-radius: 99px; padding: 0 7px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

/* Mosaic */
.mosaic { padding: 8px 0 6px; }
.msec { display: grid; grid-template-columns: minmax(170px, 230px) minmax(0, 1fr) 70px; gap: 14px; align-items: center; padding: 8px 18px; border-top: 1px solid var(--line-soft); }
.msec:first-child { border-top: 0; }
.msec .lab { display: grid; gap: 1px; min-width: 0; }
.msec .lab b { font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msec .lab small { color: var(--faint); font-size: .72rem; }
.cells { display: flex; flex-wrap: wrap; gap: 4px; }
.cell { width: 24px; height: 24px; border-radius: 6px; border: 0; cursor: pointer; padding: 0; position: relative; transition: transform .12s, box-shadow .12s; animation: pop .3s both; animation-delay: calc(var(--k) * 4ms); }
.cell:hover, .cell:focus-visible { transform: scale(1.18); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); z-index: 2; outline: 0; }
.cell.dim { opacity: .18; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } }
.msec .pc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 760; }
.msec .pc small { display: block; font-size: .68rem; font-weight: 600; color: var(--faint); }
@media (max-width: 640px) { .msec { grid-template-columns: 1fr 60px; } .msec .cells { grid-column: 1 / -1; grid-row: 2; } }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 8px 10px; font-size: .78rem; max-width: 300px; box-shadow: var(--shadow); }
.tip b { font-family: var(--mono); }
.tip span { display: block; opacity: .75; margin-top: 2px; }
.mfoot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line-soft); }
.hl { display: flex; gap: 6px; flex-wrap: wrap; }
.hl button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: .76rem; font-weight: 650; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.hl button i { width: 9px; height: 9px; border-radius: 3px; }
.hl button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }

/* Document */
.doc { max-width: 900px; margin: 0 auto; padding: 26px 30px 40px; font-family: Georgia, "Iowan Old Style", serif; }
.doc h2 { font-family: var(--font); font-size: 1.05rem; margin: 26px 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; gap: 10px; }
.doc h2 small { font-weight: 600; color: var(--muted); font-size: .78rem; }
.doc .p { display: grid; grid-template-columns: 92px minmax(0, 1fr) 210px; gap: 14px; padding: 8px 0; border-bottom: 1px dotted var(--line); cursor: pointer; }
.doc .p:hover { background: var(--raised); }
.doc .p .c { font-family: var(--mono); font-size: .74rem; color: var(--accent); font-weight: 700; padding-top: 3px; }
.doc .p .t { font-size: 1.02rem; line-height: 1.45; }
.doc .p .m { font-family: var(--font); font-size: .74rem; color: var(--muted); border-left: 3px solid; padding-left: 8px; display: grid; gap: 2px; }
.doc .p .m.COVERED { border-color: var(--ok); } .doc .p .m.ACCEPTED_GAP { border-color: var(--gold); } .doc .p .m.GAP { border-color: var(--bad); color: var(--bad); }
.doc .p .m b { font-family: var(--mono); font-weight: 700; }
@media (max-width: 720px) { .doc { padding: 16px; } .doc .p { grid-template-columns: 1fr; gap: 4px; } }

/* Gap queue */
.queue { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 920px) { .queue { grid-template-columns: 1fr; } }
.deck { position: relative; }
.deck::before, .deck::after { content: ""; position: absolute; inset: 10px 14px -10px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); z-index: -1; }
.deck::after { inset: 20px 28px -20px; opacity: .6; z-index: -2; }
.qcard { padding: 22px; display: grid; gap: 16px; border-radius: 18px; animation: deal .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes deal { from { opacity: 0; transform: translateX(30px) rotate(1deg); } }
.qcard .prog { display: flex; gap: 10px; align-items: center; font-size: .78rem; color: var(--muted); }
.qcard .prog .cbar { flex: 1; }
.qcard h2 { font-size: 1.35rem; letter-spacing: -0.01em; }
.qcard h2 span { font-family: var(--mono); font-size: .9rem; color: var(--accent); display: block; margin-bottom: 4px; }
.qcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .qcols { grid-template-columns: 1fr; } }
.qcol { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.qcol h3 { font-size: .86rem; display: flex; justify-content: space-between; gap: 6px; }
.qcol p { font-size: .78rem; color: var(--muted); }
.qcol .opt { all: unset; box-sizing: border-box; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; border: 1px solid var(--line-soft); border-radius: 10px; padding: 7px 9px; cursor: pointer; font-size: .8rem; }
.qcol .opt:hover, .qcol .opt:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
.qcol .opt b { font-family: var(--mono); color: var(--accent); font-size: .74rem; }
.qcol .opt small { grid-column: 2; color: var(--faint); font-size: .7rem; }
.qcol textarea { border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 76px; font: inherit; background: var(--surface); color: var(--ink); resize: vertical; }
.qnav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.keys { font-size: .74rem; color: var(--faint); display: flex; gap: 10px; flex-wrap: wrap; }
.qside { display: grid; gap: 14px; }
.qlist { list-style: none; margin: 0; padding: 4px 8px 10px; max-height: 420px; overflow-y: auto; display: grid; gap: 1px; }
.qlist li button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 10px auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: .78rem; }
.qlist li button:hover { background: var(--raised); }
.qlist li button[aria-current="true"] { background: var(--accent-soft); }
.qlist li i { width: 10px; height: 10px; border-radius: 3px; }
.qlist li b { font-family: var(--mono); font-size: .72rem; color: var(--accent); }
.qlist li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.qlist li.done span { text-decoration: line-through; }
@media (prefers-reduced-motion: reduce) { .cell, .qcard { animation: none; } }
</style>
</head>
<body>
<header id="appbar"></header>
<main class="app">
  <a class="back" id="back" href="#">← Frameworks</a>
  <section class="top">
    <div id="ring"></div>
    <div><p class="eyebrow">Framework coverage</p><h1 id="h1"></h1><div class="meta" id="meta"></div><p class="s" id="sent"></p></div>
    <div class="side" id="side"></div>
  </section>
  <div class="bar">
    <div class="modes" role="tablist" aria-label="View" id="modes"></div>
    <div id="lg"></div>
  </div>
  <section id="view"></section>
</main>
<div class="tip" id="tip" hidden></div>

<script src="../frameworks/data.js"></script>
<script src="../shared/kit.js"></script>
<script src="../shared/appbar.js"></script>
<script src="../frameworks/fw.js"></script>
<script src="coverage.js"></script>
<script>
const { fw, reqs } = Cov; const esc = FW.esc;
const S = { mode: new URLSearchParams(location.search).get('mode') || 'mosaic', hl: null, q: 0, handled: new Set() };
const gaps = () => reqs.filter((r) => r.state === 'GAP' || S.handled.has(r.code));

function renderTop() {
  const c = Cov.counts();
  document.title = `${FW.label(fw)} coverage`;
  document.getElementById('back').href = Cov.listHref('b');
  document.getElementById('ring').innerHTML = Kit.ring([[c.covered / c.requirements, 'var(--c-cov)'], [c.accepted / c.requirements, 'var(--c-acc)']], 96, 11, Math.round((c.covered + c.accepted) / c.requirements * 100) + '%', 'resolved');
  document.getElementById('h1').innerHTML = `${esc(fw.name)} <code>${esc(fw.version)}</code>`;
  document.getElementById('meta').innerHTML = FW.status(fw) + FW.tags(fw);
  const worst = FW.sections(reqs).map(([s, rs]) => [s, rs.filter((r) => r.state === 'GAP').length]).sort((a, b) => b[1] - a[1])[0];
  document.getElementById('sent').innerHTML = c.gaps
    ? `<b>${c.covered}</b> of ${c.requirements} Requirements are covered and ${c.accepted} gaps are accepted. <b class="bad">${c.gaps} gaps</b> are open: ${c.partialOnly} only have Partial mappings and ${c.gaps - c.partialOnly} have nothing mapped. ${esc(worst[0])} has the most (${worst[1]}).`
    : `Every one of the ${c.requirements} Requirements is covered${c.accepted ? ` or accepted (${c.accepted})` : ''}. Nothing is left to map.`;
  document.getElementById('side').innerHTML = Cov.switcher('b') + '<button class="btn" type="button" onclick="Kit.toast(\'coverage.csv downloaded\')">Download CSV</button>';
  document.getElementById('modes').innerHTML = [['mosaic', 'Mosaic'], ['doc', 'Document'], ['queue', 'Gap queue']].map(([k, l]) => `<button role="tab" data-m="${k}" aria-selected="${S.mode === k}">${l}${k === 'queue' && c.gaps ? `<span class="n">${c.gaps}</span>` : ''}</button>`).join('');
}

function mosaic() {
  const rows = FW.sections(reqs).map(([s, rs]) => {
    const c = FW.recount(rs); let k = 0;
    return `<div class="msec"><div class="lab"><b title="${esc(s)}">${esc(s)}</b><small>${c.covered}/${c.requirements} covered${c.accepted ? ` · ${c.accepted} accepted` : ''}</small></div>
      <div class="cells">${rs.map((r) => { const kd = FW.kind(r); return `<button type="button" class="cell st-${kd}${S.hl && S.hl !== kd ? ' dim' : ''}" style="--k:${k++}" data-code="${esc(r.code)}" aria-label="${esc(r.code)} ${esc(r.title)}: ${FW.STATE_LABEL[r.state]}"></button>`; }).join('')}</div>
      <div class="pc">${Math.round((c.covered + c.accepted) / c.requirements * 100)}%<small>${c.gaps ? c.gaps + ' gaps' : 'done'}</small></div></div>`;
  }).join('');
  const kinds = [['COVERED', 'Covered'], ['ACCEPTED_GAP', 'Accepted'], ['PARTIAL', 'Partial only'], ['NONE', 'No mapping']];
  return `<div class="card"><div class="mosaic">${rows}</div><div class="mfoot"><div class="hl" role="group" aria-label="Highlight">${kinds.map(([k, l]) => `<button type="button" data-hl="${k}" aria-pressed="${S.hl === k}"><i class="st-${k}"></i>${l} ${reqs.filter((r) => FW.kind(r) === k).length}</button>`).join('')}</div><span class="muted" style="font-size:.78rem">Hover a tile to read it, click to open it.</span></div></div>`;
}
function doc() {
  return `<article class="card doc">${FW.sections(reqs).map(([s, rs]) => { const c = FW.recount(rs); return `<h2 id="${encodeURIComponent(s)}">${esc(s)}<small>${c.covered}/${c.requirements} covered</small></h2>` +
    rs.map((r) => `<div class="p" data-code="${esc(r.code)}" tabindex="0"><span class="c">${esc(r.code)}</span><span class="t">${esc(r.title)}.</span><span class="m ${r.state}">${r.maps.length ? r.maps.map((m) => `<span><b>${esc(m.control)}</b> ${m.coverage === 'FULL' ? 'Full' : 'Partial'}</span>`).join('') : 'No Control mapped'}${r.state === 'ACCEPTED_GAP' ? '<span>Accepted gap</span>' : ''}</span></div>`).join(''); }).join('')}</article>`;
}
function queue() {
  if (!FW.canCurate()) return `<div class="card done-state"><h3>The gap queue is for curators</h3><p>Only a Compliance Manager or an Admin maps Controls and accepts gaps. Switch the acting user to work the queue, or use the Mosaic to read.</p></div>`;
  const list = gaps(); const open = list.filter((r) => r.state === 'GAP');
  if (!open.length) return `<div class="card done-state">${Kit.CHECK}<h3>No open gaps</h3><p>Every Requirement of ${esc(FW.label(fw))} is covered or accepted.${fw.status === 'DRAFT' ? ' It is ready to publish.' : ''}</p></div>`;
  S.q = Math.min(S.q, list.length - 1); let r = list[S.q];
  if (r.state !== 'GAP') { const nx = list.findIndex((x, i) => i > S.q && x.state === 'GAP'); S.q = nx >= 0 ? nx : list.findIndex((x) => x.state === 'GAP'); r = list[S.q]; }
  const done = list.length - open.length;
  const sug = Cov.suggest(r, 4);
  return `<div class="queue"><div class="deck"><article class="card qcard" aria-live="polite">
    <div class="prog"><span>${done} of ${list.length} handled</span>${FW.bar({ requirements: list.length, covered: done, accepted: 0, partialOnly: 0, gaps: open.length }, 'thin')}<span>${esc(r.section)}</span></div>
    <h2><span>${esc(r.code)}</span>${esc(r.title)}</h2>
    <div>${r.maps.length ? `<p class="muted" style="font-size:.82rem;margin-bottom:6px">Mapped now, Partial only, so it stays a gap:</p><div class="ctls">${r.maps.map(FW.ctl).join('')}</div>` : '<span class="nomap">No Control mapped</span>'}</div>
    <div class="qcols">
      <div class="qcol"><h3>Map a Control <span class="kbd">1–${Math.max(1, sug.length)}</span></h3><p>Map as Full. Suggested from this section and the wording.</p>
        ${r.maps.filter((m) => m.coverage === 'PARTIAL').map((m) => `<button class="opt" data-full="${esc(m.control)}"><b>${esc(m.control)}</b><span>Make the Partial mapping Full</span><small>${esc(FW.control(m.control).title)}</small></button>`).join('')}
        ${sug.map((c, i) => `<button class="opt" data-map="${esc(c.code)}"><b>${i + 1} · ${esc(c.code)}</b><span>${esc(c.title)}</span></button>`).join('')}
        <button class="btn sm" type="button" data-more>Search all Controls…</button></div>
      <div class="qcol"><h3>Create Supplementary <span class="kbd">C</span></h3><p>A new Control from ${esc(fw.name)}, mapped Full.</p>
        <button class="opt" data-create><b>${esc(FW.supCode(r))}</b><span>${esc(r.title)}</span><small>Control Owner: you · edit later in the library</small></button></div>
      <div class="qcol"><h3>Accept the gap <span class="kbd">A</span></h3><p>Say why no Control is needed.</p>
        <div class="tpls">${Cov.TEMPLATES.slice(0, 3).map((t) => `<button type="button" data-tpl="${esc(t)}">${esc(t.split(' ').slice(0, 3).join(' '))}…</button>`).join('')}</div>
        <textarea id="qJust" aria-label="Justification" placeholder="Justification"></textarea><button class="btn sm" type="button" data-accept>Accept</button></div>
    </div>
    <div class="qnav"><button class="btn" type="button" data-step="-1">← Back</button><div class="keys"><span><span class="kbd">←</span> <span class="kbd">→</span> move</span><span><span class="kbd">S</span> skip</span><span><span class="kbd">O</span> open details</span></div><button class="btn" type="button" data-step="1">Skip →</button></div>
  </article></div>
  <aside class="qside"><section class="card"><div class="card-h"><h2>Gaps</h2><p>${open.length} open</p></div>
    <ul class="qlist">${list.map((x, i) => `<li class="${x.state !== 'GAP' ? 'done' : ''}"><button type="button" data-qi="${i}" aria-current="${i === S.q}"><i class="st-${FW.kind(x)}"></i><b>${esc(x.code)}</b><span>${esc(x.title)}</span></button></li>`).join('')}</ul></section></aside></div>`;
}
function render() {
  renderTop();
  document.getElementById('view').innerHTML = S.mode === 'doc' ? doc() : S.mode === 'queue' ? queue() : mosaic();
  document.getElementById('lg').innerHTML = S.mode === 'queue' ? '' : FW.legend();
}
const cur = () => gaps()[S.q];
function handled(r, fn, msg) { S.handled.add(r.code); fn(); Cov.changed(msg); const list = gaps(); const nx = list.findIndex((x, i) => i > S.q && x.state === 'GAP'); if (nx >= 0) S.q = nx; render(); }
Cov.onChange(render);

const view = document.getElementById('view');
view.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s);
  if (t('[data-hl]')) { S.hl = S.hl === t('[data-hl]').dataset.hl ? null : t('[data-hl]').dataset.hl; render(); return; }
  if (t('.cell, .doc .p')) { Cov.openDrawer(t('[data-code]').dataset.code); return; }
  if (t('[data-qi]')) { S.q = +t('[data-qi]').dataset.qi; render(); return; }
  const r = cur(); if (!r) return;
  if (t('[data-step]')) { S.q = (S.q + +t('[data-step]').dataset.step + gaps().length) % gaps().length; render(); return; }
  if (t('[data-tpl]')) { const ta = document.getElementById('qJust'); ta.value = t('[data-tpl]').dataset.tpl; ta.focus(); return; }
  if (t('[data-more]')) { Cov.openDrawer(r.code, () => gaps().map((x) => x.code)); setTimeout(() => document.getElementById('cvAdd')?.focus(), 260); return; }
  if (t('[data-full]')) { const c = t('[data-full]').dataset.full; handled(r, () => Cov.act.setCov(r, c, 'FULL'), `${c} now covers ${r.code} in full`); return; }
  if (t('[data-map]')) { const c = t('[data-map]').dataset.map; handled(r, () => Cov.act.addMap(r, c, 'FULL'), `${c} mapped to ${r.code}`); return; }
  if (t('[data-create]')) { handled(r, () => Cov.act.createSup(r, FW.supCode(r), r.title), `Supplementary Control ${FW.supCode(r)} created`); return; }
  if (t('[data-accept]')) { const v = document.getElementById('qJust').value.trim(); if (!v) { document.getElementById('qJust').focus(); Kit.toast('A justification is required'); return; } handled(r, () => Cov.act.accept(r, v), `${r.code} accepted`); }
});
view.addEventListener('pointerover', (e) => { const c = e.target.closest('.cell'); const tip = document.getElementById('tip'); if (!c) { tip.hidden = true; return; } const r = Cov.find(c.dataset.code); tip.innerHTML = `<b>${esc(r.code)}</b> ${esc(r.title)}<span>${FW.STATE_LABEL[r.state]} · ${r.maps.length ? r.maps.map((m) => `${m.control} ${m.coverage === 'FULL' ? 'Full' : 'Partial'}`).join(', ') : 'no mapping'}</span>`; tip.hidden = false; const b = c.getBoundingClientRect(); tip.style.left = Math.min(innerWidth - 310, b.left) + 'px'; tip.style.top = (b.bottom + 8) + 'px'; });
view.addEventListener('pointerleave', () => { document.getElementById('tip').hidden = true; });
view.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('.doc .p')) Cov.openDrawer(e.target.dataset.code); });
document.getElementById('modes').addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (!b) return; S.mode = b.dataset.m; const u = new URL(location); u.searchParams.set('mode', S.mode); history.replaceState(null, '', u); render(); });
document.addEventListener('keydown', (e) => {
  if (S.mode !== 'queue' || Cov.isOpen() || e.target.closest('input, textarea, select') || !document.getElementById('ab' + 'Pal').hidden) return;
  const k = e.key.toLowerCase(), q = (s) => view.querySelector(s);
  if (k === 'arrowright' || k === 's') q('[data-step="1"]')?.click();
  else if (k === 'arrowleft') q('[data-step="-1"]')?.click();
  else if (k === 'c') q('[data-create]')?.click();
  else if (k === 'a') { e.preventDefault(); q('#qJust')?.focus(); }
  else if (k === 'o') { const r = cur(); r && Cov.openDrawer(r.code); }
  else if (/^[1-4]$/.test(k)) view.querySelectorAll('[data-map]')[+k - 1]?.click();
});
addEventListener('appbar:role', render);
Appbar.mount({ current: 'frameworks', proposal: { label: 'B', siblings: [['A', 'proposal-a.html?fw=' + fw.id], ['C', 'proposal-c.html?fw=' + fw.id]] },
  items: () => reqs.map((r) => ({ group: FW.label(fw), label: `${r.code} ${r.title}`, sub: FW.STATE_LABEL[r.state], icon: 'framework', run: () => Cov.openDrawer(r.code) })) });
render();
</script>
</body>
</html>
